# Backend corriendo nativo (./mvnw spring-boot:run) contra Mongo/Redis/Mailhog
# expuestos por docker-compose en localhost. Perfil por defecto.
spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/aguavigia}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}

aguavigia:
  cors:
    # Solo en desarrollo: el frontend nuevo vive en este mismo repositorio (otras ramas) y se sirve con su
    # propio servidor local, en otro origen que el backend. Los puertos habituales: 5173 (Vite), 3000
    # (React/Next) y 4200 (Angular). En produccion sigue cerrado: todo pasa por el mismo proxy (infra/nginx).
    origenes-permitidos:
      - http://localhost:5173
      - http://localhost:3000
      - http://localhost:4200

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.aguavigia.ctg: DEBUG
