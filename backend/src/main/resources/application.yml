spring:
  application:
    name: aguavigia-ctg
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  threads:
    virtual:
      # Un hilo virtual por peticion en Tomcat. Con el pool clasico (200 hilos) las conexiones
      # que esperan a Mongo o Redis ocupaban un hilo de plataforma cada una y el servidor dejaba de
      # aceptar trafico a los pocos cientos de peticiones concurrentes.
      enabled: true
  data:
    redis:
      # Sin estos dos, un Redis colgado dejaba cada peticion esperando sin limite.
      timeout: 2s
      connect-timeout: 2s
  servlet:
    multipart:
      # M10: una foto de celular sin comprimir pesa 3-8MB. El default de Spring (1MB) convertía
      # cualquier subida real en MaxUploadSizeExceededException, que el catch-all mandaba como 500.
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    # El SSE mantiene una conexion abierta por cliente: el tope por defecto (8192) limitaba cada
    # instancia a ~8 mil conexiones en vivo. El tope real lo pone aguavigia.sse.max-conexiones.
    max-connections: 30000
    accept-count: 500
    connection-timeout: 10s
  compression:
    # El backend responde directo al cliente (no hay proxy delante, ADR-080): comprime el mismo.
    enabled: true
    min-response-size: 1024
    mime-types: application/json,application/problem+json,application/geo+json,text/csv
  # Sin forward-headers-strategy a proposito (ADR-080): no hay un proxy de confianza delante, asi
  # que un X-Forwarded-For lo pondria el propio cliente y le bastaria cambiarlo para saltarse el
  # rate limit por IP.

aguavigia:
  privacidad:
    # Version del aviso de privacidad vigente. Se sella en cada consentimiento que da un vecino (registro y casilla
    # de avisos) para poder saber que texto acepto cada cuenta. "borrador" mientras el texto legal este pendiente (D19):
    # subirla cuando cambie el texto.
    version: 2026-10-borrador
  ubicacion:
    # Una ubicacion peor que esto (aproximada por red) no verifica ni un reporte ni el barrio de un vecino: decenas de
    # metros bastan para un barrio, cientos no. Una sola clave para los dos usos, para que no puedan divergir.
    precision-maxima-metros: 200
  vecino:
    verificacion-barrio:
      # D8: la ubicacion se usa en el momento y se descarta. Valores iniciales, a calibrar con datos reales (F6).
      intentos-por-dia: 3
  telegram:
    # RF041 (ADR-066). Sin token el canal queda armado pero apagado; con token, el backend sondea el bot cada
    # `intervalo-ms`. Solo una instancia puede sondear el mismo bot.
    token: ${TELEGRAM_BOT_TOKEN:}
    base-url: https://api.telegram.org
    intervalo-ms: 3000
  mongo:
    # Los defaults del driver (100 conexiones, 2 minutos de espera) dejaban las peticiones
    # encoladas mucho mas alla de lo que un cliente espera. Falla rapido.
    max-pool: 100
    espera-conexion-ms: 2000
    timeout-lectura-ms: 5000
    seleccion-servidor-ms: 5000
  sse:
    # Conexiones SSE por instancia; por encima se responde 429 con Retry-After.
    max-conexiones: 20000
    # Cuantos ms se agrupan los avisos de cambio antes de difundirlos a los clientes.
    intervalo-difusion-ms: 1000
    intervalo-latido-ms: 25000
  sistema:
    # REAL o SIMULACION: lo declara `GET /api/sistema/modo`. Solo la instancia de simulacion (perfil `simulacion`) lo cambia.
    modo: ${AGUAVIGIA_MODO:REAL}
  restablecimiento:
    # El enlace de «¿ya volvio el agua?» del correo de aviso vale este tiempo (D18).
    horas-vigencia-enlace: 24
  reportes:
    # RF006 — cupo por dispositivo dentro de la ventana. Estrecho para el celular anonimo, que es
    # a quien el requisito quiere frenar. Un sensor de M13 se autentica con X-IoT-Key y reporta
    # cada pocos minutos por diseno: con el cupo ciudadano se autobloqueaba al cuarto envio.
    limite-por-dispositivo: 3
    limite-por-sensor: 30
    # Plan §2: un vecino registrado reporta hasta 5 veces por sector en la ventana (3 el anonimo). Tiene cuenta, se
    # le puede suspender, y su reporte vale mas porque lleva verificacion.
    limite-por-vecino: 5
    ventana-limite-minutos: 30
  cache:
    ttl-segundos-por-cache:
      # 15s y no los 30 por defecto: el estado de un sector es el dato que el mapa muestra en vivo,
      # y DESIGN.md §6 exige frescura visible. El @CacheEvict de SectorMongoAdapter.guardar() ya
      # invalida al confirmarse un corte; este TTL solo acota lo que cambie por fuera del adaptador.
      sectores: 15
  rate-limit:
    # Multiplica el limite de las reglas (nunca las aprieta; tope 1000), SALVO las de claves y correos. 1 en la instancia real.
    # La simulacion y las pruebas de carga crean cientos de dispositivos desde una sola IP y no cabrian en los topes reales.
    factor: ${RATE_LIMIT_FACTOR:1}
    # Mando aparte para las rutas de ingreso, 2.o factor, cambio de clave, altas y correos (RateLimitProperties.RUTAS_DE_CUENTAS):
    # subir `factor` para una prueba de carga no debe aflojar el freno a la fuerza bruta. Solo la simulacion, que registra cientos
    # de cuentas por HTTP desde un equipo, lo sube. Arrancar con un valor mayor que 1 deja un aviso en el log.
    factor-cuentas: ${RATE_LIMIT_FACTOR_CUENTAS:1}
    # Limite por IP, no por huella (ADR-018). Cierra el hueco que ADR-016 dejo senalado.
    reglas:
      # Fuerza bruta contra la unica credencial del veedor: 8h de sesion (RNF011) valen mas que
      # la comodidad de reintentar rapido. 10 intentos por 5 minutos por IP (el bloqueo por cuenta y dirección, en aguavigia.cuentas, es el freno fino;
      # tras Docker Desktop todos los clientes comparten la IP de la pasarela, así que un tope más bajo sería global).
      - ruta: /api/veedor/sesion
        limite: 10
        ventana-segundos: 300
      # Segunda linea, no la primera: RF006 ya limita por dispositivo dentro de
      # RegistrarReporteService. Esto frena el flood desde una IP que rote la huella, y por eso
      # el limite es holgado — un edificio entero sin agua sale por una sola IP.
      # /** y no /api/reportes a secas: Spring hace addPathPatterns() con match exacto, asi que
      # sin el comodin /{id}/foto (subida de hasta 10MB, sin auth) y /{id}/confirmar quedaban
      # completamente fuera del limite.
      - ruta: /api/reportes/**
        limite: 30
        ventana-segundos: 60
      # Una foto se decodifica y se guarda (hasta 10 MB): 10 por 10 minutos por IP, ademas del limite anterior.
      # Va con `*` porque el patron se compara con la ruta completa (`/api/reportes/{id}/foto`).
      - ruta: /api/reportes/*/foto
        limite: 10
        ventana-segundos: 600
      # Leer fotos: cada GET con un nombre bien formado hace una consulta. Una pagina con varias fotos cabe de sobra.
      - ruta: /api/fotos/**
        limite: 120
        ventana-segundos: 60
      # El modo del sistema lo pide cada pantalla al abrirse y por debajo cuenta cuentas sinteticas (con un recuerdo de un
      # minuto en el servidor): 60 por minuto por IP sobra para una persona y acota a quien lo martille.
      - ruta: /api/sistema/modo
        limite: 60
        ventana-segundos: 60
      # «¿Ya volvio el agua?» con un toque: es publico (lo identifica el token del enlace) y escribe un voto. Tras Docker
      # Desktop todos los clientes comparten IP, asi que el tope es global en local.
      - ruta: /api/sectores/*/restablecimiento
        limite: 10
        ventana-segundos: 600
      # M13 — un sensor mal configurado o una clave filtrada no debe poder inundar el consenso.
      - ruta: /api/iot/presion
        limite: 60
        ventana-segundos: 60
      # Alta y recuperacion de cuentas: son publicos por necesidad (nadie tiene sesion todavia)
      # y cada llamada puede acabar en un correo saliente. El limite es por IP igual que el resto;
      # el freno por cuenta, que es el que para el ataque distribuido, vive en aguavigia.cuentas.
      - ruta: /api/cuentas/**
        limite: 10
        ventana-segundos: 600
      # D7: crear una identidad de dispositivo cuesta una peticion, y esta es la que se limita: 10 por hora por IP.
      # Sin este tope, fabricar identidades para llenar un quorum seria tan barato como cuando la huella la ponia el cliente.
      - ruta: /api/dispositivos
        limite: 10
        ventana-segundos: 3600
      # Ingreso de vecinos: misma regla por IP que el registro. Adivinar claves es el riesgo; el bloqueo por cuenta y
      # direccion (aguavigia.cuentas) es el freno fino, igual que en el ingreso del panel.
      - ruta: /api/vecino/sesion
        limite: 10
        ventana-segundos: 600
      # POST /api/suscripciones envia un correo a cualquier direccion que el cliente escriba: sin
      # limite servia para inundar la bandeja de un tercero. /** cubre tambien confirmar y cancelar.
      - ruta: /api/suscripciones/**
        limite: 10
        ventana-segundos: 600
      # Confirmar o desactivar el segundo factor adivina un codigo de 6 digitos: la sesion ya esta
      # autenticada, pero sin freno un token robado podia probar codigos sin limite.
      - ruta: /api/veedor/segundo-factor/**
        limite: 10
        ventana-segundos: 300
      # Cambiar la clave exige adivinar la actual: mismo freno que el segundo factor, ademas del bloqueo por cuenta.
      - ruta: /api/veedor/cuenta/**
        limite: 10
        ventana-segundos: 300
  retencion:
    # Decision del dueno (2026-09-21): los reportes se conservan 12 meses y Mongo los borra solos (indice TTL).
    # Los eventos de la bitacora son permanentes; sus ids de sustento quedan apuntando a reportes ya borrados.
    # 0 desactiva la retencion.
    reportes-dias: 365
    # La auditoria de la ciudadania (lo que se hace sobre la cuenta de un vecino) guarda solo el bloque de red de la
    # IP y se borra sola a los 180 dias. La del panel se conserva completa: es la evidencia de quien hizo que.
    # 0 conserva la auditoria de vecinos sin vencimiento.
    auditoria-vecinos-dias: 180
  mantenimiento:
    fotos-huerfanas:
      # Reconciliacion disco-vs-Mongo: borra archivos en data/fotos que ningun reporte referencia.
      # Higiene pura, sin riesgo de perder evidencia real — ver LimpiezaFotosHuerfanasJob.
      habilitada: true
      cron: "0 0 3 * * *"
      antiguedad-minima-horas: 24
    retencion-evidencia:
      # Data minimization: borra solo el binario de fotos mas viejas que dias-retencion; el
      # reporte (sector, tipo, timestamp) se conserva para RF024/Indice de Cumplimiento.
      # Deshabilitado por defecto: es una decision de politica de datos, no un default sorpresa
      # (mismo criterio que aguavigia.rate-limit — ver ADR-018).
      habilitada: false
      cron: "0 30 3 * * *"
      dias-retencion: 365
  jwt:
    # HS256 exige >= 32 bytes. Vacio por defecto: JwtProvider valida al usarse, no al arrancar
    # (ver su comentario), para que el resto del backend no dependa de esto para levantar.
    secret: ${JWT_SECRET:}
  veedor:
    # Hash BCrypt de la clave del veedor. Desde ADR-039 ya no es una credencial compartida: es la
    # clave con la que SembradorAdminInicial crea la PRIMERA cuenta ADMIN, junto con
    # aguavigia.cuentas.admin-inicial-correo. En cuanto existe alguna cuenta deja de usarse.
    password-hash: ${VEEDOR_PASSWORD_HASH:}
  cuentas:
    # Correo del primer ADMIN. Vacio por defecto: sin el no se siembra nadie y el panel queda sin
    # acceso, que es preferible a inventar una cuenta con un correo que nadie controla.
    admin-inicial-correo: ${ADMIN_INICIAL_CORREO:}
    # Bloqueo por cuenta, complementario al limite por IP de ADR-018: aquel no ve el ataque
    # repartido entre muchas IPs contra un mismo correo, que es el barato de montar.
    maximo-intentos: 5
    ventana-intentos-minutos: 15
    bloqueo-minutos: 15
    # Nombre que la app de autenticacion muestra junto al codigo. Sin tilde a proposito: algunas
    # apps no normalizan UTF-8 en la etiqueta del otpauth:// y lo pintan roto.
    emisor-totp: AguaVigia CTG
  seguridad:
    # RNF024: el registro y "olvidé mi clave" duran al menos esto, exista o no la cuenta. Debe superar
    # con holgura la rama más lenta: BCrypt tarda ~70 ms medido, pero bajo carga o en una CPU lenta puede pasar de
    # 100 ms y entonces el piso dejaría de ocultar la diferencia con la rama que solo escribe en Mongo y Redis.
    # Con hilos virtuales la espera no cuesta capacidad.
    duracion-minima-solicitud-ms: 400
  iot:
    # Clave compartida para /api/iot/presion (header X-IoT-Key), mismo patron que JWT_SECRET y
    # VEEDOR_PASSWORD_HASH: vacia por defecto, el endpoint responde 503 hasta que se configure.
    key: ${IOT_KEY:}
  ingesta:
    # Vacio por defecto: los colectores se niegan a llamar a la red sin esto (ver su comentario),
    # en vez de arrancar con una identidad por defecto que nadie decidio.
    user-agent: ${COLLECTOR_USER_AGENT:}
    conexion-timeout-ms: 10000
    lectura-timeout-ms: 15000
    # Cada cuanto corre PipelineOrquestador.ejecutarCiclo() (M9). 10 minutos por defecto.
    intervalo-ms: ${INGESTA_INTERVALO_MS:600000}
    # en-vivo (por defecto): consulta a Acuacar y a los feeds de prensa. local: lee boletines reales de Acuacar
    # guardados en ingesta-local/ y no toca la red, para presentar sin internet (ADR-082).
    modo: ${INGESTA_MODO:en-vivo}
    # Compuertas para que un aviso de Acuacar se publique solo (D5). Lo que no las pasa va a la cola del veedor con el motivo.
    # Son valores iniciales sin datos reales que los respalden: se ajustan con las metricas (F6).
    compuertas:
      confianza-minima: 0.85
      confianza-minima-restablecimiento: 0.75
      duracion-maxima-horas: 72
      margen-de-inicio-dias: 7
      maximo-de-barrios: 40
    acuacar:
      base-url: https://www.acuacar.com/wp-json/wp/v2
      tamanio-pagina: 100
    # Verificados en produccion, auditoria-fuentes-de-datos.md §7. Agregar un medio nuevo ya
    # verificado es una fila aqui, no un cambio de codigo.
    rss:
      - fuente: google-news
        url: "https://news.google.com/rss/search?q=acuacar+OR+%22corte+de+agua%22+Cartagena&hl=es-419&gl=CO&ceid=CO:es-419"
      - fuente: zona-cero
        url: "https://www.zonacero.com/rss.xml"
      - fuente: caracol-radio
        url: "https://caracol.com.co/arc/outboundfeeds/google-news-feed/?outputType=xml"
      - fuente: w-radio
        url: "https://www.wradio.com.co/arc/outboundfeeds/google-news-feed/?outputType=xml"

resilience4j:
  retry:
    instances:
      # RNF005 — "reintentar con retroceso exponencial". 3 intentos con 2s, 4s de espera: el
      # objetivo es absorber un 502 pasajero del sitio de Acuacar, no insistirle a un servidor
      # caido. Con intervalo-ms en 10 minutos, el ciclo siguiente reintenta de todas formas.
      colectores:
        max-attempts: 3
        wait-duration: 2s
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
  circuitbreaker:
    instances:
      # RNF005 — "abrir un cortacircuitos tras 3 fallos consecutivos": ventana de 3 llamadas, mínimo
      # 3 para evaluar y umbral de fallo del 100% es exactamente eso. Abierto 5 minutos; despues
      # deja pasar una sola llamada de prueba antes de volver a cerrarse.
      acuacar: &cortacircuitosDeColector
        sliding-window-type: COUNT_BASED
        sliding-window-size: 3
        minimum-number-of-calls: 3
        failure-rate-threshold: 100
        wait-duration-in-open-state: 5m
        permitted-number-of-calls-in-half-open-state: 1
        automatic-transition-from-open-to-half-open-enabled: true
      rss: *cortacircuitosDeColector

springdoc:
  # Solo los controladores de la API. Sin esto, un controlador de prueba que levante el contexto
  # (ControladorDePruebaRateLimit) se colaba en el contrato generado (BUG-121).
  packages-to-scan: com.aguavigia.ctg.api
  api-docs:
    path: /v3/api-docs
    # 3.0.1 y no 3.1: en 3.1 `nullable` deja de ser palabra clave y springdoc la descarta en vez
    # de traducirla a `type: [x, "null"]`. El contrato quedaria diciendo que `estado` siempre trae
    # valor, que es justo lo contrario de lo que decide ADR-014, y el cliente generado para el frontend
    # heredaria la mentira.
    version: openapi_3_0
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        # Lo que Docker usa para decidir si el contenedor vive y esta listo: solo lo que el proceso
        # necesita para servir. Las fuentes externas (colectores) quedan fuera a proposito:
        # acuacar.com caido es un problema de la ingesta, no del proceso. RNF007 sigue cumplido:
        # /actuator/health (global) las refleja.
        liveness:
          include: livenessState
        readiness:
          include: readinessState,mongo,redis
  health:
    mail:
      # El indicador de correo intenta abrir una conexion SMTP en cada consulta y, sin timeout,
      # un SMTP colgado colgaba tambien el healthcheck. El envio es asincrono y reintentable: un
      # correo que falla no es un servicio caido.
      enabled: false

logging:
  structured:
    format:
      # Diagnosticar era leer texto plano sin correlationId (estado-del-backend.md
      # #6.1). ECS es soporte nativo de Spring Boot 3.4+, sin dependencia nueva; CorrelationIdFilter
      # pone `correlationId` en MDC y este formato lo incluye en cada linea JSON.
      console: ecs
