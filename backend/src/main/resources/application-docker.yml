# Backend corriendo dentro de docker-compose. docker-compose.yml ya
# inyecta estos valores por variable de entorno (mismo nombre de propiedad
# con relajación de Spring); los defaults de aquí solo cubren el caso de
# correr la imagen sola, fuera de compose, en la misma red Docker.
spring:
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://mongo:27017/aguavigia}
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:mailhog}
    port: ${MAIL_PORT:1025}

# El frontend se sirve con su propio dev server (otro origen que el backend en :8081), así que este
# perfil —el del entorno local con docker-compose— tiene que dejarlo pasar. Por defecto los puertos
# habituales de Vite (5173), su preview E2E (4173), React/Next (3000) y Angular (4200); CORS_ORIGENES los reemplaza con una
# lista separada por comas. Sin uno de estos perfiles, CORS queda cerrado.
aguavigia:
  app:
    url-frontend: ${APP_URL_FRONTEND:http://localhost:5173}
  cors:
    origenes-permitidos: ${CORS_ORIGENES:http://localhost:5173,http://localhost:4173,http://localhost:3000,http://localhost:4200}
  # Arranque con un solo comando (ADR-086): sin .env el backend no se queda sin panel. El secreto del JWT sale
  # de UUID aleatorios (SecureRandom), así que las sesiones no sobreviven a un reinicio; y el primer ADMIN nace con una
  # clave aleatoria que se escribe una sola vez en el log. Con JWT_SECRET o VEEDOR_PASSWORD_HASH en .env, mandan esos.
  jwt:
    secret: ${JWT_SECRET:${random.uuid}${random.uuid}}
  # Las 30 000 cuentas sintéticas de vecino (D36): lo único inventado del sistema, para probar el volumen. Las crea el propio
  # backend al arrancar, después del ADMIN inicial y de que existan los sectores. Idempotente. 0 las desactiva.
  siembra:
    vecinos-sinteticos: ${VECINOS_SINTETICOS:30000}
  cuentas:
    admin-inicial-correo: ${ADMIN_INICIAL_CORREO:admin@aguavigia.local}
    admin-inicial-generar-clave: true
