      operationId: aceptarInvitacion
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
              - clave
              - token
              type: object
              properties:
                token:
                  type: string
                clave:
                  type: string
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
  /api/cuentas/clave:
    post:
      tags:
      - Cuentas
      summary: Fijar la clave nueva con el token del enlace
      description: Cambia la clave y revoca todas las sesiones abiertas de esa cuenta.
