      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
    post:
      tags:
      - Cuentas
      summary: Aceptar la invitación desde el formulario de la pantalla
      description: "Mismo efecto que POST /api/cuentas/invitacion, pero recibe el\
