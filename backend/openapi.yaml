openapi: 3.0.1
info:
  title: AguaVigia CTG — API publica
  description: |-
    Monitoreo ciudadano del acueducto de Cartagena de Indias.

    Plataforma ciudadana e independiente: no esta afiliada a Aguas de Cartagena
    S.A. E.S.P. ni a ninguna entidad distrital.
  contact:
    name: AguaVigia CTG
  license:
    name: Proyecto de aula
  version: 1.0.0
servers:
- url: /
  description: Mismo origen que sirve la API
tags:
- name: Suscripciones
  description: Alertas por correo cuando cambia el estado de un sector
- name: Sectores
  description: Sectores de Cartagena y su estado del servicio
- name: Veedor - Moderación
  description: Moderar reportes ciudadanos pendientes (RF018)
- name: Cuentas
  description: Páginas HTML a las que llevan los enlaces de los correos de cuenta
- name: Open311
  description: API abierta bajo el estándar Open311 GeoReport v2 (RF039)
- name: Veedor - Ingesta
  description: Salud de los colectores del pipeline de ingesta (RNF007)
- name: Cumplimiento
  description: Índice de Cumplimiento — prometido vs. real (RF020-RF022)
- name: Dispositivos
  description: Identidad pseudonima de quien reporta sin cuenta
- name: Estadisticas
  description: M7 — Estadísticas Públicas (RF023)
- name: Veedor - Ingesta
  description: "Documentos de la ingesta que siguen fallando, con su motivo (RNF006)"
- name: IoT
  description: Telemetría de sensores de presión de la red (autenticada con X-IoT-Key)
- name: Bitácora
  description: "Bitácora pública de eventos, de solo anexado (RF026-RF028)"
- name: Cuentas
  description: "Alta, verificacion y recuperacion de cuentas del panel"
- name: Sectores
  description: Estado del servicio de agua por sector de Cartagena
- name: Veedor - Cuenta propia
  description: Cambios que una persona hace sobre su propia cuenta
- name: Vecinos
  description: "Registro, ingreso y perfil de los vecinos"
- name: Veedor - Cortes
  description: Registro y cierre de cortes oficiales (RF016-RF017)
- name: Veedor - Disputas
  description: Barrios cuyo estado oficial contradicen los vecinos
- name: Reportes
  description: "Reportes ciudadanos de estado del servicio, sin registro"
- name: Veedor - Ingesta
  description: Revisión de las propuestas de la ingesta automatizada (M9)
- name: Veedor - Cuentas
  description: Gestion de cuentas y permisos del panel (solo ADMIN)
- name: Veedor - Segundo factor
  description: Alta y baja del TOTP de la propia cuenta
- name: Veedor
  description: Autenticacion del panel del veedor
paths:
  /api/veedor/usuarios/{id}/invitacion/reenvio:
    post:
      tags:
      - Cuentas
      summary: Reenviar la invitación a una cuenta que aún no la aceptó
      description: Requiere GESTIONAR_USUARIOS. El enlace anterior deja de servir
        y se reinicia su vigencia de 7 días.
      operationId: reenviarInvitacion
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "202":
          description: Invitación reenviada
        "404":
          description: No existe la cuenta
        "409":
          description: La cuenta ya aceptó la invitación (no está en estado INVITADA)
        "401":
          description: "Sin sesión, token inválido, caducado o revocado"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: La sesión no tiene el permiso que exige esta operación
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
  /api/veedor/usuarios/invitaciones:
    post:
      tags:
      - Veedor - Cuentas
      summary: Invitar a una persona con un rol ya decidido
      description: |-
        Crea la cuenta en INVITADA y le envia un enlace para que fije su clave. Al
        aceptarlo queda ACTIVA sin necesitar otra aprobacion.
      operationId: invitar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudInvitacion"
        required: true
      responses:
        "201":
          description: Invitacion enviada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioRespuesta"
        "400":
          description: Datos invalidos o barrio inexistente
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioRespuesta"
        "409":
          description: Ya existe una cuenta con ese correo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioRespuesta"
        "401":
          description: "Sin sesión, token inválido, caducado o revocado"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: La sesión no tiene el permiso que exige esta operación
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
  /api/veedor/sesion:
    post:
      tags:
      - Veedor
      summary: Iniciar sesion en el panel del veedor
      description: |-
        Devuelve un token JWT valido por 8 horas (RNF011) junto con el rol y los permisos
        ya resueltos. Si la cuenta tiene segundo factor y no se envio `codigoTotp`, la
        respuesta es 401 con type `segundo-factor-requerido`: hay que reintentar con el
        codigo, no es un error de credencial.
      operationId: iniciarSesion
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredencialVeedor"
        required: true
      responses:
        "200":
          description: "Credencial correcta, token emitido"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SesionVeedor"
        "401":
          description: "Credencial incorrecta, o falta el segundo factor"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SesionVeedor"
        "403":
          description: La cuenta existe pero no esta habilitada para entrar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SesionVeedor"
        "423":
          description: Cuenta bloqueada por intentos fallidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SesionVeedor"
        "429":
          description: Demasiados intentos desde esta IP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SesionVeedor"
  /api/veedor/sesion/cierre:
    post:
      tags:
      - Veedor
      summary: Cerrar sesion
      description: |-
        Revoca en el servidor todas las sesiones vivas de la cuenta, no solo la de este
        navegador. Un token copiado antes del cierre deja de servir en el acto.
      operationId: cerrar
      responses:
        "204":
          description: No Content
        "401":
          description: "Sin sesión, token inválido, caducado o revocado"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: La sesión no tiene el permiso que exige esta operación
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
  /api/veedor/segundo-factor/confirmacion:
    post:
      tags:
      - Veedor - Segundo factor
      summary: Confirmar el alta con un codigo de la app
      description: |-
        Devuelve una sesion nueva de alcance COMPLETO. Es lo que permite que un ADMIN
        recien sembrado pase de su sesion restringida al panel sin volver a escribir la
        clave que acaba de escribir.
      operationId: confirmar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudCodigo"
        required: true
      responses:
        "200":
          description: Segundo factor activo; sesion nueva emitida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SesionVeedor"
        "401":
          description: El codigo no coincide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SesionVeedor"
        "409":
          description: No hay un alta en curso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SesionVeedor"
        "403":
          description: La sesión no tiene el permiso que exige esta operación
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
  /api/veedor/segundo-factor/baja:
    post:
      tags:
      - Veedor - Segundo factor
      summary: Desactivar el segundo factor de la propia cuenta
      description: |-
        Exige un codigo valido: si bastara con la sesion, un token robado podria quitar
        de en medio justamente la defensa que impide usarlo. Un ADMIN no puede
        desactivarlo, su rol lo exige.
      operationId: desactivar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudCodigo"
        required: true
      responses:
        "204":
          description: Segundo factor desactivado
        "401":
          description: El codigo no coincide
        "409":
          description: El rol ADMIN exige segundo factor
        "403":
          description: La sesión no tiene el permiso que exige esta operación
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
  /api/veedor/segundo-factor/alta:
    post:
      tags:
      - Veedor - Segundo factor
      summary: "Empezar el alta: genera el secreto y devuelve el QR"
      description: |-
        El secreto queda guardado sin confirmar y todavia no se exige al entrar. Solo
        empieza a hacerlo tras confirmar un codigo valido. El secreto se muestra una
        sola vez: no hay endpoint para volver a leerlo.
      operationId: iniciar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudCodigo"
      responses:
        "200":
          description: "Secreto generado, pendiente de confirmar"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AltaSegundoFactorRespuesta"
        "401":
          description: El codigo actual no coincide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AltaSegundoFactorRespuesta"
        "409":
          description: Ya tiene segundo factor y no envio el codigo actual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AltaSegundoFactorRespuesta"
        "403":
          description: La sesión no tiene el permiso que exige esta operación
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
  /api/veedor/cuenta/clave:
    post:
      tags:
      - Veedor - Cuenta propia
      summary: Cambiar la propia clave
      description: |-
        Exige la clave actual y comparte el contador de intentos fallidos con el inicio de sesión
        (5 fallos en 15 minutos bloquean la cuenta 15 minutos). Al cambiarla se cierran **todas** las
        sesiones, la actual incluida: el cliente debe volver a pedir `POST /api/veedor/sesion` con la
        clave nueva. Se avisa por correo del cambio.
      operationId: cambiarClave
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudCambioClave"
        required: true
      responses:
        "204":
          description: Clave cambiada; todas las sesiones cerradas
        "400":
          description: "La clave actual no es correcta, la nueva no cumple la polí\
            tica (12 a 128 caracteres) o es igual a la actual"
        "423":
          description: Cuenta bloqueada por intentos fallidos
        "401":
          description: "Sin sesión, token inválido, caducado o revocado"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: La sesión no tiene el permiso que exige esta operación
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
  /api/veedor/cortes:
    get:
      tags:
      - Veedor - Cortes
      summary: Listar los cortes que afectan a un sector
      operationId: listarPorSector
      parameters:
      - name: sectorId
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CorteRespuesta"
        "401":
          description: "Sin sesión, token inválido, caducado o revocado"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: La sesión no tiene el permiso que exige esta operación
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
    post:
      tags:
      - Veedor - Cortes
      summary: Registrar un corte oficial
      description: "Sectores afectados, inicio, fin prometido y causa (RF016). Origen\
        \ VEEDOR."
      operationId: registrar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudCorte"
        required: true
      responses:
        "201":
          description: Corte registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CorteRespuesta"
        "400":
          description: Datos inválidos o algún sector no existe
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: "Sin sesión, token inválido, caducado o revocado"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: La sesión no tiene el permiso que exige esta operación
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
  /api/vecino/verificacion-barrio:
    post:
      tags:
      - Vecinos
      summary: Verificar el barrio con la ubicacion del momento
      description: |-
        Compara la coordenada con el poligono del barrio que declaraste. Si cae dentro, el
        barrio queda verificado con su fecha; la coordenada se descarta y no se guarda.
        Maximo 3 intentos por dia (429 con `Retry-After`). Si ya estaba verificado, no hace
        nada y devuelve el perfil. Es una senal blanda: sube el costo de votar desde un
        barrio ajeno, no prueba identidad.
      operationId: verificarBarrio
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudVerificacionBarrio"
        required: true
      responses:
        "200":
          description: Perfil con el barrio verificado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerfilVecinoRespuesta"
        "400":
          description: Coordenada fuera de rango o precision ausente o negativa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerfilVecinoRespuesta"
        "422":
          description: '`ubicacion-fuera-del-barrio` (la ubicacion no cae en tu barrio
            declarado) o `ubicacion-imprecisa` (precision peor que 200 m; reintenta
            con GPS)'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerfilVecinoRespuesta"
        "429":
          description: Ya usaste los 3 intentos de hoy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerfilVecinoRespuesta"
  /api/vecino/sesion:
    post:
      tags:
      - Vecinos
      summary: Iniciar sesion como vecino
      description: |-
        Devuelve un token JWT valido por 8 horas que sirve en `/api/vecino/**` (y, del panel, solo en `GET /api/veedor/yo` y `POST /api/veedor/sesion/cierre`). Una
        cuenta del panel no entra por aqui, ni una de vecino por `/api/veedor/sesion`:
        en los dos casos la respuesta es la misma 401 que ante una clave incorrecta.
      operationId: iniciarSesion_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredencialVecino"
        required: true
      responses:
        "200":
          description: "Credencial correcta, token emitido"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SesionVecino"
        "401":
          description: Credencial incorrecta
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SesionVecino"
        "403":
          description: La cuenta existe pero aun no esta activa (correo sin confirmar)
            o esta suspendida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SesionVecino"
        "423":
          description: Cuenta bloqueada por intentos fallidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SesionVecino"
        "429":
          description: Demasiados intentos desde esta IP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SesionVecino"
  /api/vecino/sesion/cierre:
    post:
      tags:
      - Vecinos
      summary: Cerrar sesion
      description: "Revoca en el servidor todas las sesiones vivas de la cuenta, no\
        \ solo la de este navegador."
      operationId: cerrar_1
      responses:
        "204":
          description: No Content
  /api/suscripciones:
    post:
      tags:
      - Suscripciones
      summary: Suscribirse a los avisos de uno o más sectores
      description: |-
        Crea la suscripción en PENDIENTE_CONFIRMACION y envía un correo de doble
        opt-in (Ley 1581/2012, RF013). No empieza a recibir avisos hasta confirmarla.
      operationId: suscribirse
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudSuscripcion"
        required: true
      responses:
        "201":
          description: "Suscripción creada, correo de confirmación en camino"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuscripcionRespuesta"
        "400":
          description: Correo inválido o algún sector no existe
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/suscripciones/confirmar:
    get:
      tags:
      - Suscripciones
      summary: Pantalla del enlace «Confirmar» del correo
      description: |-
        Página a la que lleva el enlace del correo. Solo muestra un botón: NO confirma nada, porque un
        antivirus o una vista previa de enlaces abre los GET sin que nadie los pida (`ADR-054`). La
        acción ocurre al enviar el formulario, que hace POST a la misma ruta.
      operationId: pantallaConfirmar
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Página con el botón
          content:
            text/html:
              schema:
                type: string
    post:
      tags:
      - Suscripciones
      summary: Confirmar la suscripción (doble opt-in)
      description: |-
        Acción del botón de la página de confirmación (o de un cliente de API). El token es de un solo enlace, no de un solo uso:
        confirmarla dos veces no falla (RF013). Responde JSON o una página HTML de cortesía
        según el `Accept` de quien pide: el formulario de la página responde HTML y un cliente de API
        responde JSON. `token` va como parámetro de consulta o del formulario.
      operationId: confirmar_1
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Suscripción confirmada
          content:
            application/json:
              schema:
                type: object
            text/html:
              schema:
                type: object
        "400":
          description: "Token inválido, inexistente o de una suscripción ya cancelada"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/suscripciones/cancelar:
    get:
      tags:
      - Suscripciones
      summary: Pantalla del enlace de baja de todo correo (RF015)
      description: |-
        Página a la que lleva el enlace del correo. Solo muestra un botón: NO cancela nada, porque un
        antivirus o una vista previa de enlaces abre los GET sin que nadie los pida (`ADR-054`). La
        acción ocurre al enviar el formulario, que hace POST a la misma ruta.
      operationId: pantallaCancelar
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Página con el botón
          content:
            text/html:
              schema:
                type: string
    post:
      tags:
      - Suscripciones
      summary: Darse de baja en un clic (RF015)
      description: |-
        Acción del botón de la página de baja (o de un cliente de API). Sin pedir credenciales: el token que llega en cada correo es suficiente. Responde
        JSON o una página HTML de cortesía según el `Accept` de quien pide (mismo motivo
        que en {@code /confirmar}).
      operationId: cancelar
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      - name: Accept
        in: header
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Suscripción cancelada
          content:
            application/json:
              schema:
                type: object
            text/html:
              schema:
                type: object
        "400":
          description: Token inválido o inexistente
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/reportes:
    post:
      tags:
      - Reportes
      summary: Registrar un reporte ciudadano
      description: |-
        Sin registro ni cuenta (RF005), pero con identidad: la cabecera `X-Dispositivo` (token de
        `POST /api/dispositivos`) o la sesion de un vecino. Sin ninguna de las dos responde 401
        `dispositivo-invalido`. Limita automaticamente los reportes por identidad en la ventana vigente
        (RF006, 3 para un dispositivo y 5 para un vecino) — ver 429. Hace falta el `sectorId`, la
        `coordenada` o ambos (RF007): con solo la coordenada el servidor infiere el sector que la
        contiene y responde 400 si cae fuera de todo barrio de Cartagena. La coordenada se envia solo si
        el usuario autorizo compartir su ubicacion; con su `precisionMetros` el servidor verifica el
        reporte (campo `verificacion` de la respuesta) y guarda solo una aproximacion de ella.
      operationId: registrar_1
      parameters:
      - name: X-Dispositivo
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudReporte"
        required: true
      responses:
        "201":
          description: Reporte registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReporteRespuesta"
        "400":
          description: "Sector inexistente, tipo inválido, coordenada fuera de Cartagena\
            \ o sin sector ni coordenada"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: "Falta `X-Dispositivo`, no lo firmó este servidor o el dispositivo\
            \ ya no existe (type `dispositivo-invalido`): pide otro con POST /api/dispositivos"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "429":
          description: La identidad superó el límite de reportes para este sector
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/reportes/{id}/foto:
    post:
      tags:
      - Reportes
      summary: Agregar evidencia a un reporte
      description: Permite subir una foto y asociarla a un reporte existente (M10).
      operationId: agregarEvidencia
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              required:
              - foto
              type: object
              properties:
                foto:
                  type: string
                  format: binary
      responses:
        "200":
          description: Evidencia agregada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReporteRespuesta"
        "400":
          description: Error en la solicitud
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Reporte no encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/reportes/{id}/confirmar:
    post:
      tags:
      - Reportes
      summary: Confirmar un reporte
      description: |-
        Permite a otro vecino confirmar un reporte ciudadano (M11). Sin cuerpo: la identidad de quien
        confirma viaja en `X-Dispositivo` o en la sesion de un vecino, igual que al reportar.
      operationId: confirmar_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: X-Dispositivo
        in: header
        required: false
        schema:
          type: string
      responses:
        "200":
          description: Reporte confirmado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReporteRespuesta"
        "401":
          description: Falta o no es válida la identidad del dispositivo (type `dispositivo-invalido`)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: Reporte no encontrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/iot/presion:
    post:
      tags:
      - IoT
      summary: Registrar una lectura de presión de un sensor
      description: |-
        Una presión por debajo del umbral (15 psi por defecto) se registra como reporte de
        PRESION_BAJA con el cupo de sensor. Una lectura normal responde 200 sin registrar
        nada. Sin cuerpo de respuesta en el caso exitoso.
      operationId: reportarPresion
      parameters:
      - name: X-IoT-Key
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IotPresionRequest"
        required: true
      responses:
        "200":
          description: Lectura recibida (haya generado reporte o no)
        "400":
          description: "Falta el sensor, el sector no existe o la coordenada es invá\
            lida"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: X-IoT-Key ausente o incorrecta
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "503":
          description: El servidor no tiene configurada la clave de sensores
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/dispositivos:
    post:
      tags:
      - Dispositivos
      summary: Pedir una identidad de dispositivo
      description: |-
        Crea un dispositivo nuevo y devuelve su token firmado. Pidelo la primera vez, guardalo y
        enviarlo en `X-Dispositivo` en cada reporte y confirmacion. Cada llamada crea una
        identidad distinta: no la pidas en cada reporte. Si un reporte responde 401
        `dispositivo-invalido`, pide otro. Maximo 10 por hora por IP.
      operationId: pedir
      responses:
        "201":
          description: Token emitido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenDeDispositivoRespuesta"
        "429":
          description: Demasiados tokens pedidos desde esta IP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenDeDispositivoRespuesta"
  /api/cuentas/verificacion:
    post:
      tags:
      - Cuentas
      summary: Confirmar el correo con el token del enlace
      description: Pasa la cuenta a PENDIENTE_APROBACION. Sigue sin poder entrar hasta
        que un ADMIN la apruebe.
      operationId: verificarCorreo
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Correo confirmado
        "400":
          description: "Enlace invalido, vencido o ya usado"
  /api/cuentas/verificacion/reenvio:
    post:
      tags:
      - Cuentas
      summary: Reenviar el correo de verificación
      description: |-
        Para quien se registró y no recibió el enlace (o venció). Responde 202 **siempre**, exista o no
        la cuenta y ya esté verificada o no: no revela qué correos están registrados. Reenvía como mucho
        una vez cada 2 minutos por cuenta. El enlace anterior deja de servir.
      operationId: reenviarVerificacion
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudReenvioVerificacion"
        required: true
      responses:
        "202":
          description: "Si había algo que reenviar, el correo va en camino"
        "400":
          description: Correo mal formado
  /api/cuentas/vecino:
    post:
      tags:
      - Vecinos
      summary: Registrarse como vecino
      description: |-
        Crea la cuenta en PENDIENTE_VERIFICACION y envia el enlace de confirmacion. Al
        confirmar el correo la cuenta queda ACTIVA, sin aprobacion de un administrador.
        Exige el barrio y aceptar el aviso de privacidad; la casilla de avisos es aparte.
        Responde 202 aunque el correo ya tenga cuenta, para no revelar que direcciones
        estan registradas.
      operationId: registrarse
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudRegistroVecino"
        required: true
      responses:
        "202":
          description: Solicitud recibida; revisa tu correo
        "400":
          description: "Correo mal formado, clave que no cumple la politica, barrio\
            \ ausente o inexistente, o privacidad no aceptada"
  /api/cuentas/restablecimiento:
    post:
      tags:
      - Cuentas
      summary: Pedir el enlace para restablecer la clave
      description: "Responde 202 siempre, exista o no la cuenta. Ver el javadoc de\
        \ esta clase."
      operationId: pedirRestablecimiento
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudRestablecer"
        required: true
      responses:
        "202":
          description: Accepted
  /api/cuentas/registro:
    post:
      tags:
      - Cuentas
      summary: Solicitar una cuenta del panel
      description: |-
        Crea la cuenta en PENDIENTE_VERIFICACION y envia el enlace de confirmacion.
        Registrarse no concede ningun permiso: hace falta verificar el correo y que un
        ADMIN apruebe. Responde 202 aunque el correo ya tenga cuenta, para no revelar
        que direcciones estan registradas.
      operationId: registrarse_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudRegistro"
        required: true
      responses:
        "202":
          description: Solicitud recibida; revisa tu correo
        "400":
          description: "Correo mal formado, clave que no cumple la politica o barrio\
            \ inexistente"
  /api/cuentas/invitacion:
    post:
      tags:
      - Cuentas
      summary: Aceptar una invitacion fijando la clave
      description: Deja la cuenta ACTIVA con el rol que eligio quien invito. No hace
        falta otra aprobacion.
      operationId: aceptar
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudFijarClave"
        required: true
      responses:
        "204":
          description: Cuenta activa; ya puedes iniciar sesion
        "400":
          description: Enlace invalido o clave que no cumple la politica
  /api/cuentas/enlaces/verificar:
    get:
      tags:
      - Cuentas
      summary: Pantalla del enlace «Confirmar mi correo»
      description: "Muestra el botón de confirmación. No consume el token: eso ocurre\
        \ al enviar el formulario."
      operationId: pantallaVerificar
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
    post:
      tags:
      - Cuentas
      summary: Confirmar el correo desde el formulario de la pantalla
      description: "Mismo efecto que POST /api/cuentas/verificacion, pero recibe el\
        \ formulario y responde HTML."
      operationId: verificarCorreo_1
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
              - token
              type: object
              properties:
                token:
                  type: string
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
  /api/cuentas/enlaces/restablecer:
    get:
      tags:
      - Cuentas
      summary: Pantalla del enlace para restablecer la clave
      description: Muestra el formulario para elegir la clave nueva. No consume el
        token.
      operationId: pantallaRestablecer
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
    post:
      tags:
      - Cuentas
      summary: Restablecer la clave desde el formulario de la pantalla
      description: "Mismo efecto que POST /api/cuentas/clave, pero recibe el formulario\
        \ y responde HTML."
      operationId: restablecerClave
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              required:
              - clave
              - token
              type: object
              properties:
                token:
                  type: string
                clave:
                  type: string
      responses:
        "200":
          description: OK
          content:
            text/html:
              schema:
                type: string
  /api/cuentas/enlaces/invitacion:
    get:
      tags:
      - Cuentas
      summary: Pantalla del enlace de invitación
      description: Muestra el formulario para elegir la clave. No consume el token.
