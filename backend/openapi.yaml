              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/cumplimiento/serie:
    get:
      tags:
      - Cumplimiento
      summary: Evolución del índice mes a mes (RF024)
      description: |-
        Un punto por mes con al menos un corte cerrado, en hora de Cartagena. Sin
        `sectorId`, la ciudad completa. `desde` y `hasta` son opcionales y acotan por la
        hora real de restablecimiento. Lista vacía si no hay cortes cerrados en el
        rango — una serie sin datos es una respuesta válida.
      operationId: serie
      parameters:
      - name: sectorId
        in: query
        required: false
        schema:
          type: string
      - name: desde
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: hasta
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: Serie generada
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PuntoSerieRespuesta"
  /api/cumplimiento/serie.csv:
    get:
      tags:
      - Cumplimiento
      summary: La misma serie en CSV (RF025)
      description: "Separador `;` y BOM UTF-8, para que Excel en español la abra sin\
        \ romper las tildes."
      operationId: serieCsv
      parameters:
      - name: sectorId
        in: query
        required: false
        schema:
          type: string
      - name: desde
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: hasta
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: CSV generado
          content:
            text/csv:
              schema:
                type: string
  /api/cumplimiento/sectores/{sectorId}:
    get:
      tags:
      - Cumplimiento
      summary: "Índice agregado de un sector, sobre sus cortes cerrados"
      operationId: porSector
      parameters:
      - name: sectorId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Índice calculado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndiceCumplimientoRespuesta"
        "400":
          description: El sector no tiene cortes cerrados todavía
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/cumplimiento/cortes/{corteId}:
    get:
      tags:
      - Cumplimiento
      summary: Índice de un corte cerrado
      operationId: porCorte
      parameters:
      - name: corteId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Índice calculado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndiceCumplimientoRespuesta"
        "404":
          description: El corte no existe
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: El corte todavía no está cerrado
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/bitacora:
    get:
      tags:
      - Bitácora
      summary: "Listar los eventos de la bitácora, más recientes primero"
      description: |-
        Paginado: la bitácora es de solo anexado (RF028), así que crece sin cota.
        El total, la página y el enlace a la siguiente viajan en las cabeceras
        `X-Total-Count`, `X-Total-Pages`, `X-Page`, `X-Page-Size` y `Link` — el cuerpo
        sigue siendo un arreglo JSON, así que un cliente que las ignore no se rompe.
        Por defecto 50 eventos; el máximo por página es 200.

        Filtros opcionales, que se combinan y buscan en todo el historial: `sectorId`,
        `tipo`, `desde` (inclusivo) y `hasta` (exclusivo), ambos instantes ISO 8601 en
        UTC. El enlace `Link` a la siguiente página conserva los filtros. Sin
        coincidencias, la respuesta es una página vacía, no un error; un `tipo` que no
        existe o un `hasta` que no es posterior a `desde` son un 400.
      operationId: listar_2
      parameters:
      - name: pagina
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: tamano
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: sectorId
        in: query
        required: false
        schema:
          type: string
      - name: tipo
        in: query
        required: false
        schema:
          type: string
          enum:
          - CORTE_ANUNCIADO
          - CORTE_CONFIRMADO_POR_CIUDADANOS
          - CORTE_RESTABLECIDO
          - CORTE_DETECTADO_POR_INGESTA
      - name: desde
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: hasta
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: Listado generado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EventoBitacoraRespuesta"
        "400":
          description: "Tipo de evento desconocido, fecha mal formada o rango invertido"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
  /api/bitacora/{id}/sustento:
    get:
      tags:
      - Bitácora
      summary: Los reportes que sustentan un evento de consenso (RF011)
      description: |-
        Ids de los reportes ciudadanos que sostuvieron el cambio de estado, para contrastarlo con la
        evidencia. Van aparte del listado porque en una avería grande pueden ser miles. Paginado con las
        mismas cabeceras que el listado; por defecto 50 ids por página, máximo 200. Vacío en los
        eventos que no son de consenso.
      operationId: sustento
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: pagina
        in: query
        required: false
        schema:
          type: integer
          format: int32
      - name: tamano
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Ids de la página pedida (vacía si se pasa del final)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "404":
          description: No existe el evento
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
components:
  schemas:
    SolicitudInvitacion:
      required:
      - correo
      - nombre
      - rol
      type: object
      properties:
        correo:
          minLength: 1
          type: string
          format: email
        nombre:
          maxLength: 80
          minLength: 2
          type: string
        rol:
          type: string
          description: "ADMIN, VEEDOR u OBSERVADOR"
        barrioId:
          type: string
          description: "Opcional: slug del barrio de la persona. 400 si no existe."
          nullable: true
      description: "Invitacion emitida por un ADMIN: crea la cuenta con su rol y manda\
        \ el enlace"
    UsuarioRespuesta:
      type: object
      properties:
        id:
          type: string
        correo:
          type: string
        nombre:
          type: string
        estado:
          type: string
          description: "PENDIENTE_VERIFICACION, PENDIENTE_APROBACION, INVITADA, ACTIVA,\
            \ SUSPENDIDA o RECHAZADA"
        rol:
          type: string
        barrioId:
          type: string
          description: Slug del barrio donde vive la persona; nulo si no lo dio (ADR-081)
          nullable: true
        permisosEfectivos:
          type: array
          items:
            type: string
        permisosConcedidos:
          type: array
          items:
            type: string
        permisosRevocados:
          type: array
          items:
            type: string
        segundoFactorActivo:
          type: boolean
        creadoEn:
          type: string
          format: date-time
        actualizadoEn:
          type: string
          format: date-time
      description: "Cuenta del panel, tal como la ve un ADMIN"
    CredencialVeedor:
      required:
      - clave
      - correo
      type: object
      properties:
        correo:
          minLength: 1
          type: string
          description: Correo de la cuenta
          format: email
          example: veedor@ejemplo.org
        clave:
          minLength: 1
          type: string
          description: Clave de la cuenta
        codigoTotp:
          type: string
          description: |-
            Codigo de 6 digitos de la app de autenticacion. Se omite en el primer intento; si la
            cuenta tiene segundo factor, la respuesta 401 con type `segundo-factor-requerido`
            indica que hay que reintentar incluyendolo.
      description: Credencial de acceso al panel del veedor
    SesionVeedor:
      type: object
      properties:
        token:
          type: string
          description: "Token JWT. Se envia como 'Authorization: Bearer <token>'"
        usuarioId:
          type: string
        nombre:
          type: string
        correo:
          type: string
        rol:
          type: string
          description: "ADMIN, VEEDOR u OBSERVADOR"
        permisos:
          type: array
          description: "Permisos efectivos ya resueltos: rol mas concedidos menos\
            \ revocados"
          items:
            type: string
            description: "Permisos efectivos ya resueltos: rol mas concedidos menos\
              \ revocados"
        alcance:
          type: string
          description: |-
            COMPLETO, o ALTA_SEGUNDO_FACTOR cuando la cuenta es ADMIN y todavia no dio de alta su
            TOTP. Con ese alcance el token solo sirve para /api/veedor/segundo-factor.
      description: "Sesion emitida para el panel del veedor (RNF011: expira en 8 horas)"
    SolicitudCodigo:
      required:
      - codigo
      type: object
      properties:
        codigo:
          minLength: 1
          type: string
      description: Codigo de 6 digitos de la app de autenticacion
    AltaSegundoFactorRespuesta:
      type: object
      properties:
        uri:
          type: string
          description: URI otpauth:// para pintar el QR
        secreto:
          type: string
          description: "El mismo secreto en Base32, para teclearlo si la camara falla"
      description: "Datos para dar de alta el segundo factor. El secreto solo se muestra\
        \ aqui, una vez."
    SolicitudCambioClave:
      required:
      - claveActual
      - claveNueva
      type: object
      properties:
        claveActual:
          minLength: 1
          type: string
          description: La clave de hoy. Sin ella un token robado bastaría para cambiarla.
        claveNueva:
          minLength: 1
          type: string
          description: "La nueva: de 12 a 128 caracteres y distinta de la actual."
      description: Cambiar la propia clave con la sesión iniciada
    SolicitudCorte:
      required:
      - causa
      - finPrometido
      - inicio
      - sectoresAfectados
      type: object
      properties:
        sectoresAfectados:
          minItems: 1
          type: array
          description: Identificadores de los sectores afectados
          example:
          - manga
          - bocagrande
          items:
            type: string
            description: Identificadores de los sectores afectados
            example: "[\"manga\",\"bocagrande\"]"
        inicio:
          type: string
          format: date-time
        finPrometido:
          type: string
          format: date-time
        causa:
          minLength: 1
          type: string
          example: Mantenimiento planta El Bosque
        caducaEn:
          type: string
          description: "Opcional. El corte del veedor es el override: desde esta hora\
            \ deja de afirmar nada, aunque nadie lo haya cerrado."
          format: date-time
          nullable: true
      description: Registro de un corte oficial por el veedor (RF016)
    ProblemDetail:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
        detail:
          type: string
          nullable: true
        instance:
          type: string
          format: uri
          nullable: true
        properties:
          type: object
          additionalProperties:
            type: object
          nullable: true
    CierreRespuesta:
      type: object
      properties:
        sectorId:
          type: string
        hora:
          type: string
          format: date-time
        fuente:
          type: string
          description: "Quién lo sostiene: VEEDOR, ACUACAR, VECINOS, SENSOR o PRENSA"
        provisional:
          type: boolean
          description: "Un cierre que solo sostienen los vecinos o los sensores: un\
            \ veedor o un boletín puede confirmarlo o corregirlo"
      description: Cómo y cuándo se restableció un barrio dentro del corte
    CorteRespuesta:
      type: object
      properties:
        id:
          type: string
        sectoresAfectados:
          type: array
          items:
            type: string
        inicio:
          type: string
          format: date-time
        finPrometido:
          type: string
          format: date-time
        causa:
          type: string
        origen:
          type: string
        estado:
          type: string
          description: "ANUNCIADO, CONFIRMADO, RESTABLECIDO, EXPIRADO o ANULADO. RESTABLECIDO\
            \ solo cuando todos sus barrios tienen cierre; EXPIRADO nadie lo confirmó\
            \ a tiempo y no cuenta en el Índice."
        cierres:
          type: array
          description: Un cierre por cada barrio ya restablecido; los pendientes no
            aparecen. Vacío mientras ningún barrio se haya restablecido.
          items:
            $ref: "#/components/schemas/CierreRespuesta"
        motivoAnulacion:
          type: string
          description: "Solo en un corte ANULADO: por qué se anuló"
          nullable: true
        caducaEn:
          type: string
          description: "Solo en el corte del veedor, que es el override: desde esta\
            \ hora deja de afirmar nada. Nulo si dura hasta que alguien lo cierre\
            \ o expire."
          format: date-time
          nullable: true
      description: Corte oficial (RF016-RF017)
    CoordenadaDTO:
      required:
      - latitud
      - longitud
      type: object
      properties:
        latitud:
          maximum: 90
          exclusiveMaximum: false
          minimum: -90
          exclusiveMinimum: false
          type: number
          format: double
        longitud:
          maximum: 180
          exclusiveMaximum: false
          minimum: -180
          exclusiveMinimum: false
          type: number
          format: double
      description: "Coordenada GPS del reporte, solo cuando el usuario la autoriza\
        \ (RF007)"
    SolicitudVerificacionBarrio:
      required:
      - coordenada
      - precisionMetros
      type: object
      properties:
        coordenada:
          $ref: "#/components/schemas/CoordenadaDTO"
        precisionMetros:
          minimum: 0
          type: number
          description: |-
            Precision de la lectura en metros (`coords.accuracy` del navegador). Una precision peor que 200 m
            (ubicacion aproximada por red) no verifica y responde 422 `ubicacion-imprecisa`.
          format: double
          example: 25.5
      description: |-
        La ubicacion del momento. El servidor la compara con el barrio que declaraste y la descarta: no se
        guarda ni se audita; solo queda que el barrio quedo verificado.
    ConsentimientoRespuesta:
      type: object
      properties:
        tipo:
          type: string
          description: PRIVACIDAD o AVISOS
        version:
          type: string
        fecha:
          type: string
          format: date-time
      description: "Lo que acepto, con la version del texto y la fecha"
    PerfilVecinoRespuesta:
      type: object
      properties:
        id:
          type: string
        correo:
          type: string
        nombre:
          type: string
        estado:
          type: string
          description: ACTIVA mientras pueda iniciar sesion
        barrioId:
          type: string
          description: Slug del barrio que declaro
        barrioVerificado:
          type: boolean
          description: true si probo con su ubicacion que vive en `barrioId`
        barrioVerificadoEn:
          type: string
          format: date-time
          nullable: true
        recibeAvisos:
          type: boolean
          description: true si acepto recibir avisos de cortes de su barrio
        consentimientos:
          type: array
          description: "Lo que acepto, con la version del texto y la fecha"
          items:
            $ref: "#/components/schemas/ConsentimientoRespuesta"
        creadoEn:
          type: string
          format: date-time
        actualizadoEn:
          type: string
          format: date-time
      description: Perfil del vecino con sesion
    CredencialVecino:
      required:
      - clave
      - correo
      type: object
      properties:
        correo:
          minLength: 1
          type: string
          description: Correo de la cuenta
          format: email
          example: vecina@ejemplo.org
        clave:
          minLength: 1
          type: string
          description: Clave de la cuenta
      description: Credencial de un vecino registrado
    SesionVecino:
      type: object
      properties:
        token:
          type: string
          description: "Token JWT. Se envia como 'Authorization: Bearer <token>'"
        usuarioId:
          type: string
        nombre:
          type: string
        correo:
          type: string
        permisos:
          type: array
          description: Siempre `GESTIONAR_PERFIL_PROPIO`
          items:
            type: string
            description: Siempre `GESTIONAR_PERFIL_PROPIO`
      description: "Sesion de un vecino. Sirve en `/api/vecino/**`; del panel solo\
        \ abre `GET /api/veedor/yo` y `POST /api/veedor/sesion/cierre`, que muestran\
        \ o cierran lo propio."
    SolicitudSuscripcion:
      required:
      - correo
      - sectorIds
      type: object
      properties:
        correo:
          minLength: 1
          type: string
          description: Correo al que llegarán los avisos
          format: email
          example: vecino@correo.com
        sectorIds:
          minItems: 1
          type: array
          description: Identificadores de los sectores a seguir
          items:
            type: string
            description: Identificadores de los sectores a seguir
      description: Solicitud para suscribirse a los avisos de uno o más sectores
    SuscripcionRespuesta:
      type: object
      properties:
        id:
          type: string
        correo:
          type: string
        sectorIds:
          type: array
          items:
            type: string
        estado:
          type: string
          description: "PENDIENTE_CONFIRMACION, CONFIRMADA o CANCELADA"
        creadaEn:
          type: string
          format: date-time
      description: "Suscripción creada, pendiente de confirmación por correo (RF013)"
    SolicitudReporte:
      required:
      - tipo
      type: object
      properties:
        sectorId:
          type: string
          description: |-
            Identificador del sector reportado. Opcional si viaja la coordenada: entonces el
            servidor infiere el barrio que la contiene (RF007). Si no viaja ninguno, 400.
          nullable: true
          example: bocagrande
        tipo:
          minLength: 1
          type: string
          description: "SIN_AGUA, PRESION_BAJA o SERVICIO_RESTABLECIDO"
          example: SIN_AGUA
        coordenada:
          $ref: "#/components/schemas/CoordenadaDTO"
        precisionMetros:
          minimum: 0
          type: number
          description: |-
            Precision de la coordenada en metros (`coords.accuracy` del navegador). Sin ella, o si es peor que
            200 m, la ubicacion no verifica el reporte.
          format: double
          nullable: true
          example: 25.5
      description: |-
        Reporte ciudadano (RF005-RF008). La identidad de quien reporta no va en el cuerpo: viaja en la
        cabecera `X-Dispositivo` (token de `POST /api/dispositivos`) o en la sesion de un vecino
        (`Authorization: Bearer`). Un campo `huella` en el cuerpo, como el de versiones anteriores, se ignora.
    ReporteRespuesta:
      type: object
      properties:
        id:
          type: string
        sectorId:
          type: string
        tipo:
          type: string
        timestamp:
          type: string
          format: date-time
        fotoUrl:
          type: string
        confirmaciones:
          type: integer
          format: int32
        verificacion:
          type: string
          description: |-
            Cuanto respalda el servidor que quien reporta esta en el barrio: CUENTA_VERIFICADA, UBICACION_VERIFICADA
            o NINGUNA. Lo decide el servidor; el cliente solo lo muestra.
      description: Reporte ciudadano registrado
    IotCoordenada:
      type: object
      properties:
        lat:
          maximum: 90.0
          exclusiveMaximum: false
          minimum: -90.0
          exclusiveMinimum: false
          type: number
          format: double
        lon:
          maximum: 180.0
          exclusiveMaximum: false
          minimum: -180.0
          exclusiveMinimum: false
          type: number
          format: double
    IotPresionRequest:
      required:
      - sectorId
      - sensorId
      type: object
      properties:
        sensorId:
          maxLength: 64
          minLength: 0
          pattern: "[A-Za-z0-9._:-]+"
          type: string
        sectorId:
          maxLength: 100
          minLength: 0
          type: string
        presionPsi:
          maximum: 1000.0
          exclusiveMaximum: false
          minimum: 0.0
          exclusiveMinimum: false
          type: number
          format: double
        coordenada:
          $ref: "#/components/schemas/IotCoordenada"
    TokenDeDispositivoRespuesta:
      type: object
      properties:
        token:
          type: string
          description: "Se envia en la cabecera `X-Dispositivo` de `POST /api/reportes`\
            \ y de `/confirmar`. Guardalo: perderlo es perder la identidad."
      description: Identidad de dispositivo emitida por el servidor
    SolicitudReenvioVerificacion:
      required:
      - correo
      type: object
      properties:
        correo:
          minLength: 1
          type: string
          format: email
      description: "Pedir de nuevo el correo de verificación. Responde siempre 202,\
        \ exista o no la cuenta."
    Consentimiento:
      type: object
      properties:
        privacidad:
          type: boolean
          description: Acepta el aviso de privacidad vigente. Debe ser true.
        avisos:
          type: boolean
          description: Acepta recibir avisos de cortes de su barrio
          default: false
      description: |-
        Las dos casillas son independientes: aceptar la privacidad es obligatorio para registrarse;
        `avisos` autoriza recibir avisos de cortes de tu barrio y por defecto es falso.
    SolicitudRegistroVecino:
      required:
      - barrioId
      - clave
      - consentimiento
      - correo
      - nombre
      type: object
      properties:
        correo:
          minLength: 1
          type: string
          format: email
        nombre:
          maxLength: 80
          minLength: 2
          type: string
        clave:
          minLength: 1
          type: string
          description: Minimo 12 caracteres. La politica completa vive en ClaveEnClaro.
        barrioId:
          minLength: 1
          type: string
          description: Slug del barrio donde vives (uno de `GET /api/sectores`). 400
            si no existe.
          example: manga
        consentimiento:
          $ref: "#/components/schemas/Consentimiento"
      description: |-
        Registro de un vecino. Confirmar el correo activa la cuenta: no hay aprobacion de un administrador
        porque un vecino solo gestiona su propio perfil.
    SolicitudRestablecer:
      required:
      - correo
      type: object
      properties:
        correo:
          minLength: 1
          type: string
          format: email
      description: "Pedir el enlace de restablecimiento. Responde siempre 202, exista\
        \ o no la cuenta."
    SolicitudRegistro:
      required:
      - clave
      - correo
      - nombre
      type: object
      properties:
        correo:
          minLength: 1
          type: string
          format: email
        nombre:
          maxLength: 80
          minLength: 2
          type: string
          description: Nombre con el que apareceras en la auditoria del panel
        clave:
          minLength: 1
          type: string
          description: Minimo 12 caracteres. La politica completa vive en ClaveEnClaro.
        barrioId:
          type: string
          description: "Opcional: slug del barrio donde vives (uno de `GET /api/sectores`).\
            \ 400 si no existe."
          nullable: true
          example: manga
      description: "Solicitud de acceso al panel. No concede nada: exige verificar\
        \ el correo y que un ADMIN apruebe."
    SolicitudFijarClave:
      required:
      - clave
      - token
      type: object
      properties:
        token:
          minLength: 1
          type: string
          description: Token que venia en el enlace del correo
        clave:
          minLength: 1
          type: string
      description: Fijar clave desde un enlace de un solo uso (invitacion o restablecimiento)
    SolicitudPermisos:
      required:
      - rol
      type: object
      properties:
        rol:
          minLength: 1
          type: string
          description: "ADMIN, VEEDOR u OBSERVADOR"
        concedidos:
          type: array
          items:
            type: string
        revocados:
          type: array
          items:
            type: string
      description: |-
        Rol de base mas los ajustes por persona. Los permisos del rol se aplican solos; `concedidos`
        anade sobre ellos y `revocados` quita. Un permiso en las dos listas es un error y se rechaza.
    ReporteModeracionRespuesta:
      type: object
      properties:
        id:
          type: string
        sectorId:
          type: string
        tipo:
          type: string
        coordenada:
          $ref: "#/components/schemas/CoordenadaDTO"
        timestamp:
          type: string
          format: date-time
        estadoModeracion:
          type: string
          description: "PENDIENTE, APROBADO o DESCARTADO"
        verificacion:
          type: string
          description: "CUENTA_VERIFICADA, UBICACION_VERIFICADA o NINGUNA: cuánto\
            \ respalda el servidor que quien reporta está en el barrio"
      description: Reporte ciudadano en la cola de moderación del veedor (RF018)
    PropuestaIngestaRespuesta:
      type: object
      properties:
        id:
          type: string
        sectorId:
          type: string
        estadoPropuesto:
          type: string
          description: "SIN_SERVICIO, PRESION_BAJA, CORTE_PROGRAMADO o CON_SERVICIO"
        fuente:
          type: string
          description: Colector que la detectó
          example: acuacar
        urlOriginal:
          type: string
          description: Enlace al boletín o nota de prensa original
          nullable: true
        citaTextual:
          type: string
          description: "Fragmento del que se dedujo el estado, para que el veedor\
            \ pueda verificarlo"
        confianza:
          type: number
          description: |-
            Entre 0 y 1, graduada según la evidencia que halló el extractor (ADR-032): 0.85 con
            enumeración explícita de barrios y horario, 0.75 con enumeración sin horario, 0.45
            con una mención suelta en prosa. Sirve para ordenar la cola, no para publicar solo.
          format: double
        detectadaEn:
          type: string
          format: date-time
        estadoRevision:
          type: string
          description: "PENDIENTE, APROBADA o DESCARTADA"
        inicioDeclarado:
          type: string
          description: |-
            Inicio de la ventana que el boletín prometió. Nulo cuando el texto no la declaraba:
            no se estima (ADR-006).
          format: date-time
          nullable: true
        finPrometido:
          type: string
          description: |-
            Fin prometido de la misma ventana. Junto con el inicio es lo que permite que el
            estado del sector evolucione solo (ADR-033) y lo que alimenta el Índice de
            Cumplimiento (RF020-RF022).
          format: date-time
          nullable: true
      description: |-
        Propuesta de cambio de estado detectada por la ingesta automatizada (M9), esperando la
        revisión de un veedor. No afecta el mapa público hasta que se apruebe.
    SolicitudAnulacion:
      required:
      - motivo
      type: object
      properties:
        motivo:
          minLength: 1
          type: string
          description: Por qué se anula. Queda en la bitácora pública y en la auditoría.
          example: El boletín hablaba de otro barrio
      description: Anulación de un corte o de una propuesta de la ingesta que se publicó
        por error
    SolicitudCierreCorte:
      required:
      - horaReal
      type: object
      properties:
        horaReal:
          type: string
          format: date-time
      description: Cierre de un corte con la hora real de restablecimiento (RF017)
    SolicitudPerfilVecino:
      type: object
      properties:
        nombre:
          maxLength: 80
          minLength: 2
          type: string
        barrioId:
          type: string
          description: Slug del barrio donde vives. Cambiarlo anula la verificacion
            de barrio anterior. 400 si no existe.
          nullable: true
          example: crespo
        recibirAvisos:
          type: boolean
          description: true acepta avisos de cortes de tu barrio; false retira ese
            consentimiento
          nullable: true
      description: Cambios al perfil. Solo se aplica lo que viene; un campo ausente
        no se toca.
    SaludColectorRespuesta:
      type: object
      properties:
        nombre:
          type: string
          example: acuacar
        ultimaEjecucionExitosa:
          type: string
          description: Nulo si el colector todavía no ha completado un ciclo con éxito
          format: date-time
          nullable: true
        ultimoFallo:
          type: string
          description: Nulo si nunca ha fallado
          format: date-time
          nullable: true
        motivoDelUltimoFallo:
          type: string
          description: "Mensaje del último fallo, para diagnosticar sin entrar al\
            \ servidor"
          nullable: true
        itemsProcesados:
          type: integer
          description: Documentos traídos desde que arrancó el proceso
          format: int64
        tasaDeError:
          type: number
          description: "Entre 0 y 1, sobre los ciclos corridos desde que arrancó el\
            \ proceso"
          format: double
        fallosConsecutivos:
          type: integer
          description: "Ciclos seguidos fallando. Desde 3, el colector se reporta\
            \ caído en /actuator/health"
          format: int32
      description: Estado de salud de un colector de la ingesta automatizada
    DocumentoFallidoRespuesta:
      type: object
      properties:
        fuente:
          type: string
          example: acuacar
        urlOriginal:
          type: string
        titulo:
          type: string
          nullable: true
        motivo:
          type: string
          description: Mensaje de la excepción que hizo fallar el procesamiento
        primerIntento:
          type: string
          format: date-time
        ultimoIntento:
          type: string
          format: date-time
        reintentos:
          type: integer
          description: "Veces que se reintentó sin éxito, una por ciclo de ingesta"
          format: int32
      description: Documento de la ingesta que falló al procesarse y sigue en cola
        de reintento
    RespaldoVecinalRespuesta:
      type: object
      properties:
        vecinos:
          type: integer
          format: int32
        umbral:
          type: integer
          format: int32
      description: Cuántos vecinos respaldan un estado y cuántos hacían falta
      nullable: true
    SectorRespuesta:
      type: object
      properties:
        id:
          type: string
          description: Identificador estable del sector
          example: bocagrande
        nombre:
          type: string
          description: Nombre del barrio segun el GeoJSON oficial
          example: BOCAGRANDE
        poblacion:
          type: integer
          description: |-
            Habitantes según el censo. **Nulo cuando el barrio no tiene dato censal** (27 de los 211): no es 0,
            y no debe mostrarse como «0 habitantes».
          format: int32
          nullable: true
          example: 12000
        estado:
          type: string
          description: |-
            Estado conocido del servicio. **Nulo cuando no hay dato verificado**: no se asume
            CON_SERVICIO por omision, porque publicar servicio normal sin verificarlo es el
            falso positivo que el proyecto evita (ADR-014). Presentarlo como "sin datos".
          nullable: true
          enum:
          - CON_SERVICIO
          - SIN_SERVICIO
          - PRESION_BAJA
          - CORTE_PROGRAMADO
        actualizadoEn:
          type: string
          description: Cuando se registro ese estado. Nulo si el sector no tiene estado.
          format: date-time
          nullable: true
        verificadoEn:
          type: string
          description: |-
            Última vez que una fuente con autoridad (consenso de vecinos, corte del veedor o boletín
            aprobado) sostuvo ese estado, haya cambiado o no (ADR-073). Nunca anterior a
            `actualizadoEn`. Nulo si el sector no tiene estado. Confirmar sin cambiar no emite
            evento SSE: el valor se renueva al volver a pedir la lista.
          format: date-time
          nullable: true
        origen:
          type: string
          description: |-
            Quién sostiene el estado: ACUACAR (boletín oficial), PRENSA (nota aprobada por el veedor),
            VEEDOR (corte o cierre del veedor), VECINOS (quórum de reportes) o SENSOR. Nulo si el sector
            no tiene estado.
          nullable: true
          enum:
          - ACUACAR
          - VEEDOR
          - VECINOS
          - PRENSA
          - SENSOR
        ventanaPrometida:
          $ref: "#/components/schemas/VentanaPrometidaRespuesta"
        restablecimientoPorConfirmar:
          type: boolean
          description: |-
            La promesa ya venció y nadie confirmó que volvió el agua: el barrio sigue como estaba, pero
            por confirmar. Un restablecimiento pide menos vecinos que reportar una avería.
        enDisputa:
          type: boolean
          description: |-
            Un quórum de vecinos contradice a la fuente oficial. El color no cambia: la contradicción
            se muestra como una insignia y llega a la cola del veedor.
        reportesEnContra:
          type: integer
          description: Cuántos vecinos sostienen esa contradicción. 0 si no hay disputa.
          format: int32
        respaldo:
          $ref: "#/components/schemas/RespaldoVecinalRespuesta"
      description: Sector de Cartagena con el estado conocido de su servicio de agua
    VentanaPrometidaRespuesta:
      type: object
      properties:
        inicio:
          type: string
          format: date-time
        fin:
          type: string
          format: date-time
      description: Desde cuándo y hasta cuándo prometió la fuente oficial la afectación
      nullable: true
    EventoAuditoriaRespuesta:
      type: object
      properties:
        id:
          type: string
        accion:
          type: string
        autorCorreo:
          type: string
          description: Nulo cuando actua el sistema o alguien sin sesion
        sujetoCorreo:
          type: string
        detalle:
          type: string
        ip:
          type: string
        ocurrioEn:
          type: string
          format: date-time
      description: "Asiento de la bitacora de auditoria de cuentas: quien le hizo\
        \ que a quien"
    Open311Response:
      type: object
      properties:
        service_request_id:
          type: string
        status:
          type: string
          description: open o closed
          example: open
        service_code:
          type: string
          description: Código del tipo de servicio
          example: AGUA-001
        service_name:
          type: string
        description:
          type: string
        address:
          type: string
          description: "Nombre del barrio. La unidad geográfica es el sector, no un\
            \ punto (ADR-026)"
        requested_datetime:
          type: string
          description: Cuándo se registró el estado actual del sector
          format: date-time
          nullable: true
        updated_datetime:
          type: string
          description: "Igual a requested_datetime: el estado del sector es su propia\
            \ actualización"
          format: date-time
          nullable: true
      description: service_request de Open311 GeoReport v2
    RespuestaSectores:
      type: object
      properties:
        sectores:
          type: array
          items:
            $ref: "#/components/schemas/SectorRespuesta"
        generadoEn:
          type: string
          description: Instante en que el servidor genero esta respuesta (UTC)
          format: date-time
      description: Listado de sectores con la hora en que el servidor genero la respuesta
    EstadisticaSectorRespuesta:
      type: object
      properties:
        sectorId:
          type: string
        nombre:
          type: string
        cantidadCortes:
          type: integer
          format: int32
      description: Sector con su cantidad de cortes registrados
    EstadisticasRespuesta:
      type: object
      properties:
        sectoresMasAfectados:
          type: array
          items:
            $ref: "#/components/schemas/EstadisticaSectorRespuesta"
        cortesPorDiaDeSemana:
          type: object
          additionalProperties:
            type: integer
            format: int32
        duracionPromedioHoras:
          type: number
          format: double
      description: "Estadísticas públicas globales (M7, RF023)"
    IndiceCumplimientoRespuesta:
      type: object
      properties:
        sectorId:
          type: string
          description: "Nulo cuando el índice es por corte o global, no por sector"
        duracionPrometidaSegundos:
          type: integer
          format: int64
        duracionRealSegundos:
          type: integer
          format: int64
        desviacionSegundos:
          type: integer
          description: duracionReal - duracionPrometida. Negativa si terminó antes
            de lo prometido
          format: int64
        porcentajeCumplimiento:
          type: number
          description: Capado en 100 cuando el corte termina antes o a tiempo
          format: double
      description: |-
        Índice de Cumplimiento (RF020-RF022): comparación explícita entre duración prometida y
        real, nunca un porcentaje aislado.
    PuntoSerieRespuesta:
      type: object
      properties:
        periodo:
          type: string
          description: "Mes en hora de Cartagena, ISO 8601"
          example: 2026-08
        duracionPrometidaSegundos:
          type: integer
          format: int64
        duracionRealSegundos:
          type: integer
          format: int64
        desviacionSegundos:
          type: integer
          description: duracionReal - duracionPrometida. Negativa si terminaron antes
            de lo prometido
          format: int64
        porcentajeCumplimiento:
          type: number
          description: Capado en 100 cuando los cortes terminan antes o a tiempo
          format: double
        cantidadCortes:
          type: integer
          description: |-
            Cortes cerrados sobre los que se calculó el mes. Un 40% sobre un solo corte y uno
            sobre veinte no significan lo mismo.
          format: int32
      description: Un mes de la evolución del Índice de Cumplimiento (RF024)
    EventoBitacoraRespuesta:
      type: object
      properties:
        id:
          type: string
        tipo:
          type: string
          description: "CORTE_ANUNCIADO, CORTE_CONFIRMADO_POR_CIUDADANOS, CORTE_RESTABLECIDO\
            \ o CORTE_DETECTADO_POR_INGESTA"
        sectorId:
          type: string
          description: Nulo si el evento no está atado a un sector
        corteId:
          type: string
          description: Nulo si el evento no está atado a un corte oficial (p. ej.
            consenso ciudadano)
        timestamp:
          type: string
          format: date-time
        descripcion:
          type: string
        estado:
          type: string
          description: "Estado del servicio que afirma el evento: CON_SERVICIO, SIN_SERVICIO,\
            \ PRESION_BAJA o CORTE_PROGRAMADO. Nulo si el evento no habla del servicio\
            \ — presentarlo entonces como informativo, sin color de estado."
        urlOriginal:
          type: string
          description: Boletín o nota que respalda el evento. Nulo si la fuente no
            lo trae.
        imagenUrl:
          type: string
          description: Portada del boletín. Nula si la fuente no la trae.
        cantidadReportesSustento:
          type: integer
          description: "RF011 — cuántos reportes ciudadanos sostuvieron el cambio,\
            \ en los eventos de consenso; 0 en los demás. Los ids no viajan en el\
            \ listado (pesaban cientos de KB por página): se piden con GET /api/bitacora/{id}/sustento."
          format: int32
        fuente:
          type: string
          description: "Quién sostiene el evento: ACUACAR o PRENSA (boletín o nota),\
            \ VECINOS (quórum) o VEEDOR (panel). Nulo en los eventos anteriores a\
            \ este dato."
          nullable: true
        respaldo:
          $ref: "#/components/schemas/RespaldoRespuesta"
      description: "Evento de la bitácora pública, de solo anexado (RF026-RF028)"
    RespaldoRespuesta:
      type: object
      properties:
        vecinos:
          type: integer
          format: int32
        umbral:
          type: integer
          format: int32
      description: Cuántos vecinos respaldan un cambio y cuántos hacían falta
      nullable: true
  securitySchemes:
    bearerAuth:
      type: http
      description: |-
        Token que devuelve POST /api/veedor/sesion, en la cabecera
        `Authorization: Bearer <token>`. Caduca a las 8 horas y no se renueva: al
        caducar hay que volver a iniciar sesión.
      scheme: bearer
      bearerFormat: JWT
