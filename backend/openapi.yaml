      - bearerAuth: []
  /api/veedor/ingesta/propuestas/{id}/anulacion:
    patch:
      tags:
      - Veedor - Ingesta
      summary: Anular una propuesta ya aprobada
      description: |-
        Deshace una aprobación por error: la propuesta queda ANULADA con su motivo, deja de afirmar nada
        del presente, la bitácora anexa una corrección que cita el boletín y el barrio se recalcula.
        Queda constancia en la auditoría.
      operationId: anularPropuesta
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudAnulacion"
        required: true
      responses:
        "200":
          description: Propuesta anulada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropuestaIngestaRespuesta"
        "400":
          description: Falta el motivo
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "404":
          description: La propuesta no existe
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: La propuesta no estaba aprobada
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: "Sin sesión, token inválido, caducado o revocado"
          content:
            application/problem+json:
              schema:
