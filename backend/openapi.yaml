                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: La sesión no tiene el permiso que exige esta operación
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
  /api/veedor/reportes/{id}/aprobar:
    patch:
      tags:
      - Veedor - Moderación
      summary: Aprobar un reporte
      operationId: aprobar_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Reporte aprobado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReporteModeracionRespuesta"
        "404":
          description: El reporte no existe
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: "Sin sesión, token inválido, caducado o revocado"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: La sesión no tiene el permiso que exige esta operación
          content:
