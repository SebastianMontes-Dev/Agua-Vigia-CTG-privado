        "400":
          description: "Enlace invalido, vencido o ya usado"
  /api/veedor/usuarios/{id}/suspension:
    patch:
      tags:
      - Veedor - Cuentas
      summary: Suspender una cuenta activa
      description: "Revoca sus sesiones al instante: no espera a que caduque su token."
      operationId: suspender
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Cuenta suspendida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioRespuesta"
        "409":
