      summary: Denegar una solicitud de acceso
      operationId: rechazar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioRespuesta"
        "401":
          description: "Sin sesión, token inválido, caducado o revocado"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: La sesión no tiene el permiso que exige esta operación
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
  /api/veedor/usuarios/{id}/reactivacion:
    patch:
      tags:
      - Veedor - Cuentas
      summary: Devolver el acceso a una cuenta suspendida
      operationId: reactivar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioRespuesta"
        "401":
          description: "Sin sesión, token inválido, caducado o revocado"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: La sesión no tiene el permiso que exige esta operación
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
  /api/veedor/usuarios/{id}/permisos:
    patch:
      tags:
      - Veedor - Cuentas
      summary: Cambiar rol y ajustes de permisos de una cuenta
      description: |-
        Revoca las sesiones vivas de esa persona, tanto si los permisos se amplian como
        si se recortan: el token los lleva dentro y una sesion abierta seguiria usando
        los anteriores.
      operationId: cambiarPermisos
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudPermisos"
        required: true
      responses:
        "200":
          description: Permisos actualizados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioRespuesta"
        "409":
          description: Dejaria al sistema sin ningun ADMIN activo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioRespuesta"
        "401":
          description: "Sin sesión, token inválido, caducado o revocado"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: La sesión no tiene el permiso que exige esta operación
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
  /api/veedor/usuarios/{id}/aprobacion:
    patch:
      tags:
      - Veedor - Cuentas
      summary: "Aprobar una cuenta que ya verifico su correo, asignandole permisos"
      operationId: aprobar
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolicitudPermisos"
        required: true
      responses:
        "200":
          description: Cuenta activa
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioRespuesta"
        "409":
          description: "La cuenta no esta esperando aprobacion, o el ADMIN se administra\
            \ a si mismo"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioRespuesta"
        "401":
          description: "Sin sesión, token inválido, caducado o revocado"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: La sesión no tiene el permiso que exige esta operación
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
