              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
  /api/veedor/ingesta/propuestas/{id}/descartar:
    patch:
      tags:
      - Veedor - Ingesta
      summary: Descartar una propuesta
      description: "No toca el sector. La propuesta se archiva como descartada, no\
        \ se borra. Descartar una ya aprobada responde 409."
      operationId: descartar_1
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Propuesta descartada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropuestaIngestaRespuesta"
        "404":
          description: La propuesta no existe
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: La propuesta ya estaba aprobada
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: "Sin sesión, token inválido, caducado o revocado"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: La sesión no tiene el permiso que exige esta operación
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
      security:
      - bearerAuth: []
  /api/veedor/ingesta/propuestas/{id}/aprobar:
    patch:
      tags:
      - Veedor - Ingesta
      summary: Aprobar una propuesta
      description: |-
        Aplica el estado propuesto al sector y anexa el evento a la bitácora pública
        (RF026). Es el único camino por el que la ingesta llega al mapa.
      operationId: aprobar_2
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Propuesta aprobada y estado aplicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropuestaIngestaRespuesta"
        "404":
          description: La propuesta no existe
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "409":
          description: "El sector de la propuesta ya no existe, o la propuesta ya\
            \ estaba descartada"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "401":
          description: "Sin sesión, token inválido, caducado o revocado"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "403":
          description: La sesión no tiene el permiso que exige esta operación
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
