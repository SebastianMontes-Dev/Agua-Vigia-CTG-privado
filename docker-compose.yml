# Un solo comando deja todo listo (ADR-094). Sin .env: el backend genera su secreto de sesión y la clave del primer ADMIN,
# que se imprime una sola vez en el log del backend.
#
#   docker compose up -d --build            → Mongo, réplica, Redis, Mailhog y backend, y el `sembrador`, que carga los 211 barrios.
#                                             El backend crea el ADMIN y, en segundo plano, 30 000 cuentas SINTÉTICAS de vecino
#                                             (lo único inventado: se dicen sintéticas y la API lo declara en /api/sistema/modo).
#                                             No hay reportes, cortes ni estados inventados: el mapa muestra lo que dicen los
#                                             boletines de Acuacar y los vecinos de verdad. Repetir no duplica datos.
#
# Los pasos del sembrador también se piden uno a uno: docker compose run --rm sembrador sembrar-sectores
# Para levantar sin sembrar: docker compose up -d --build mongo mongo-init-replica redis mailhog backend
#
# Visor web de la base (opcional):
#
#   docker compose --profile demo up
#
networks:
  aguavigia:
    driver: bridge

services:
  mongo:
    image: mongo:7.0
    container_name: aguavigia-mongo
    restart: unless-stopped
    # --bind_ip_all es para que los otros contenedores lleguen a Mongo por la red interna de compose; hacia el
    # equipo solo se publica en 127.0.0.1 (abajo), así que nadie de la red del aula ve la base.
    command: ["--replSet", "rs0", "--bind_ip_all"]
    env_file:
      - path: .env
        required: false
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-aguavigia}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - aguavigia
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Replica set de un solo nodo (Fase 3 de plan-validacion-backend.md): sin esto Mongo no soporta
  # transacciones multi-documento. Un solo contenedor de un solo uso: comprueba si ya está iniciado
  # (`rs.status()`) y si no, lo inicia — así `docker compose up` repetido no falla la segunda vez.
  mongo-init-replica:
    image: mongo:7.0
    container_name: aguavigia-mongo-init-replica
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - aguavigia
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo:27017 --quiet --eval '
          try {
            rs.status();
            print("Replica set ya iniciado");
          } catch (e) {
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] });
            print("Replica set iniciado");
          }
        '

  redis:
    image: redis:7-alpine
    container_name: aguavigia-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - aguavigia
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: aguavigia-mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # UI web
    networks:
      - aguavigia

  backend:
    image: aguavigia/backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: aguavigia-backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_DATA_MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/aguavigia?replicaSet=rs0}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_MAIL_HOST: ${MAIL_HOST:-mailhog}
      SPRING_MAIL_PORT: ${MAIL_PORT:-1025}
      CORS_ORIGENES: ${CORS_ORIGENES:-http://localhost:5173,http://localhost:4173,http://localhost:3000,http://localhost:4200}
      # La API y las pantallas de avisos tienen bases públicas independientes (ADR-078).
      AGUAVIGIA_APP_URL_PUBLICA: ${APP_URL_PUBLICA:-http://localhost:8081}
      AGUAVIGIA_APP_URL_FRONTEND: ${APP_URL_FRONTEND:-http://localhost:5173}
      # Sin User-Agent los colectores de Acuacar y prensa no hacen la petición (ética de datos, punto 3):
      # el valor por defecto deja la ingesta funcionando en un `docker compose up` sin .env. El correo
      # de contacto debe ser uno que controles; cámbialo con COLLECTOR_USER_AGENT en tu .env.
      COLLECTOR_USER_AGENT: "${COLLECTOR_USER_AGENT:-AguaVigiaCTG-Bot/1.0 (+alertas@aguavigia.com)}"
      # auto: lee Acuacar en vivo y, si falla (sin red, sitio caído), usa los 13 boletines reales guardados en el repositorio. Nunca
      # inventa uno. en-vivo no tiene respaldo; local no toca la red (ADR-082).
      INGESTA_MODO: ${INGESTA_MODO:-auto}
      # Cuántas cuentas sintéticas de vecino crea el backend al arrancar (0 las desactiva).
      VECINOS_SINTETICOS: ${VECINOS_SINTETICOS:-30000}
      # Una red distinta por votante es lo que pide el quórum por defecto (2). Con Docker Desktop todos los clientes del equipo
      # llegan al backend con la misma IP, así que con 2 el quórum nunca se cumpliría: en local se baja a 1. Es una concesión
      # del entorno local, no del producto: en una presentación desde una sola red se dice abiertamente (ADR-090).
      AGUAVIGIA_CONSENSO_REDES_MINIMAS: ${AGUAVIGIA_CONSENSO_REDES_MINIMAS:-1}
      # Multiplica los topes por IP (10 dispositivos por hora, 30 reportes por minuto...). 1 los deja como están; solo se sube
      # para pruebas de carga o siembras que crean muchas identidades desde un mismo equipo. NO mueve los de ingreso, correo ni
      # cambio de clave (esos los controla RATE_LIMIT_FACTOR_CUENTAS, que solo usa la simulación); el tope es 1000.
      RATE_LIMIT_FACTOR: ${RATE_LIMIT_FACTOR:-1}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - fotos-data:/app/data/fotos
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init-replica:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - aguavigia
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Siembra de un solo uso (scripts/sembrador.mjs): al terminar de arrancar el backend carga los 211 barrios, espera a que el
  # backend termine de crear las cuentas sintéticas y sale. Es idempotente. También sirve para otros pasos sin instalar Node:
  # docker compose run --rm sembrador verificar
  sembrador:
    image: aguavigia/sembrador:local
    build:
      context: .
      dockerfile: scripts/Dockerfile
    container_name: aguavigia-sembrador
    restart: "no"
    environment:
      MONGODB_URI: mongodb://mongo:27017/?directConnection=true
      MONGODB_DB: ${MONGO_INITDB_DATABASE:-aguavigia}
      API_URL: http://backend:8080
      VECINOS_SINTETICOS: ${VECINOS_SINTETICOS:-30000}
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aguavigia

  # Visor web de Mongo para enseñar dónde se guarda cada dato. Solo con el perfil demo y solo en este equipo (127.0.0.1).
  mongo-express:
    image: mongo-express:1.0.2
    container_name: aguavigia-mongo-express
    profiles: ["demo"]
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongo:27017/?directConnection=true
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "127.0.0.1:8082:8081"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - aguavigia

volumes:
  mongo-data:
  redis-data:
  fotos-data:
