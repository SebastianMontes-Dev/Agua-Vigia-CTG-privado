name: Frontend CI

# Solo lee el repositorio: ningun job de este flujo publica, comenta ni escribe (el GITHUB_TOKEN por defecto puede hacerlo todo).
permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - "scripts/**"
      - "docker-compose.yml"
      - ".env.example"
      - "DESIGN.md"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/**"
      - "scripts/**"
      - "docker-compose.yml"
      - ".env.example"
      - "DESIGN.md"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    name: Lint, tipos, contrato, pruebas y build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Configurar Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Tipos (tsc -b)
        run: npm run typecheck

      # Un cambio en backend/openapi.yaml sin `npm run api:sync` deja al cliente tipado contra un contrato viejo.
      - name: Contrato de la API sin deriva
        run: npm run api:check

      # tokens.test.ts compara tokens.css con DESIGN.md: por eso DESIGN.md dispara este workflow.
      - name: Pruebas unitarias (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Pruebas E2E (Playwright, sin backend)
        run: npm run test:e2e

      - name: Publicar el reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 14

  # Por este job el filtro de rutas incluye backend, siembra y compose. El sembrador del compose (ADR-086) no se levanta:
  # las pruebas E2E siembran su propio conjunto controlado en el paso siguiente.
  integracion:
    name: Núcleo ciudadano contra backend real
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            scripts/package-lock.json
      - run: node scripts/preparar-env-ci.mjs
      - name: Reservar la ingesta externa durante la prueba de F2
        run: |
          docker compose up -d --wait mongo redis
          docker compose exec -T redis redis-cli SET tarea-unica:ingesta pruebas-f2 EX 3600
      - run: docker compose up -d --build --wait mongo redis mailhog backend
      - run: npm ci
        working-directory: scripts
      - name: Sembrar demo y casos de borde
        run: |
          node scripts/sembrar-sectores.mjs
          node scripts/sembrar-demo.mjs
          # La base de este job es desechable: sembrar-demo ya dejo reportes, que las guardas de estos dos scripts tomarian por reales.
          node scripts/sembrar-historico-cortes.mjs --sobre-datos-reales
          node scripts/preparar-pruebas-frontend.mjs --sobre-datos-reales
          docker compose exec -T redis redis-cli EVAL "redis.call('FLUSHDB'); redis.call('SET', 'tarea-unica:ingesta', 'pruebas-f2', 'EX', 3600); return 1" 0
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: E2E reales de mapa, reportes y avisos con Mailhog
        run: npm run test:e2e:real
        working-directory: frontend
      - name: Conservar trazas
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: nucleo-ciudadano-backend-real
          path: frontend/test-results/
          retention-days: 14
      - name: Detener entorno efímero
        if: always()
        run: docker compose down -v
