name: Escaneo de secretos

# Existe desde el Sprint 0: evitar que una credencial llegue al repositorio. Las reglas propias viven en
# .gitleaks.toml.
#
# BUG-089: gitleaks-action pide los commits del PR al API para acotar el escaneo; sin estos
# permisos el GITHUB_TOKEN no trae pull-requests:read y el job falla con 403 en todo PR,
# aunque no haya ningun secreto (el escaneo por push si pasaba).

permissions:
  contents: read
  pull-requests: read

on:
  push:
  pull_request:

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Escanear secretos
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
