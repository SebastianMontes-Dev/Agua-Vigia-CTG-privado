name: Contenedores y dependencias

# RNF020 ("levanta con un solo comando") se daba por cumplido sin que nada lo verificara: el CI
# solo corría `mvnw verify` y únicamente cuando cambiaba `backend/**`. Un Dockerfile roto o un
# compose mal editado no fallaba la build de nadie hasta que alguien intentaba levantar el entorno.
# El proyecto corre solo en local (ADR-057, ADR-080): hay un único compose, el de docker-compose.yml.

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  compose:
    name: Construir la imagen y validar el compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Detecta un YAML inválido o una variable sin definir antes de gastar tiempo construyendo.
      - name: Validar la sintaxis del compose
        run: |
          cp .env.example .env
          docker compose -f docker-compose.yml config --quiet

      - name: Construir la imagen del backend
        run: docker compose -f docker-compose.yml build backend

      # BUG-101: sin este directorio en la imagen, el volumen de fotos nacía como root y el usuario sin
      # privilegios no podía escribir en él (toda subida de foto respondía 500 en una instalación limpia).
      - name: El directorio de fotos debe existir en la imagen y ser del usuario de la aplicación
        run: |
          IMAGEN=$(docker compose -f docker-compose.yml config --images | grep backend | head -1)
          DUENO=$(docker run --rm --entrypoint stat "$IMAGEN" -c '%U' /app/data/fotos)
          echo "Dueño de /app/data/fotos en $IMAGEN: $DUENO"
          [ "$DUENO" = "aguavigia" ] || { echo "::error::/app/data/fotos no es de aguavigia (es de '$DUENO')"; exit 1; }

      # ADR-086: la entrega exige que todo se levante con `docker compose up` y que Mongo tenga al menos 30 000
      # registros. Se levanta sin .env, como en el equipo de la sustentación, y el sembrador debe terminar con 0.
      - name: Un solo docker compose up deja la base sembrada
        run: |
          docker compose up -d --build
          CODIGO=$(docker wait aguavigia-sembrador)
          docker compose logs --no-log-prefix sembrador | grep -v "Cuentas insertadas" | tail -25
          [ "$CODIGO" = "0" ] || { echo "::error::el sembrador terminó con código $CODIGO"; docker compose logs backend | tail -50; exit 1; }
          docker compose run --rm sembrador verificar
          docker compose logs backend | grep -q "ADMINISTRADOR INICIAL" || { echo "::error::el backend no creó el ADMIN inicial"; exit 1; }

      - name: Un segundo docker compose up no duplica datos
        run: |
          contar() { docker compose exec -T mongo mongosh aguavigia --quiet --eval 'print(db.usuarios.countDocuments() + "/" + db.reportes.countDocuments() + "/" + db.cortes.countDocuments())'; }
          ANTES=$(contar)
          docker compose up -d
          docker wait aguavigia-sembrador
          DESPUES=$(contar)
          echo "usuarios/reportes/cortes: $ANTES -> $DESPUES"
          [ "$ANTES" = "$DESPUES" ] || { echo "::error::el segundo up cambió los datos"; exit 1; }

      # ADR-087: «metan 1 000 usuarios más» tiene que sumar exactamente 1 000, y borrar el lote dejarlo como estaba.
      - name: Agregar un lote de usuarios con faker y borrarlo
        run: |
          contar() { docker compose exec -T mongo mongosh aguavigia --quiet --eval 'print(db.usuarios.countDocuments())'; }
          ANTES=$(contar)
          docker compose run --rm sembrador agregar-usuarios --cantidad 1000 --lote lote-ci | grep -v '^\s\|^[{}]'
          CON_LOTE=$(contar)
          [ "$CON_LOTE" = "$((ANTES + 1000))" ] || { echo "::error::se esperaban $((ANTES + 1000)) usuarios y hay $CON_LOTE"; exit 1; }
          docker compose run --rm sembrador agregar-usuarios --borrar-lote lote-ci | tail -2
          [ "$(contar)" = "$ANTES" ] || { echo "::error::borrar el lote no devolvió los $ANTES usuarios"; exit 1; }


      - name: Verificar que los scripts de shell son válidos
        run: |
          for script in scripts/*.sh; do
            bash -n "$script" || exit 1
          done

  dependencias:
    name: Vulnerabilidades conocidas en dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configurar JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # `gitleaks` cubre secretos filtrados; nada cubría un CVE conocido en Spring Boot, jjwt o el
      # driver de Mongo. Falla solo con severidad alta o crítica: un aviso de severidad media no
      # debe bloquear a nadie un viernes.
      # Trivy resuelve cada POM que no encuentre en el caché local, y Maven Central responde 429
      # tras unas pocas decenas de peticiones. Resolviendo antes, el escaneo lee de ~/.m2.
      - name: Poblar el caché de Maven
        working-directory: backend
        run: ./mvnw -B -q dependency:resolve dependency:resolve-plugins

      # La etiqueta lleva prefijo `v`: sin el, la acción no resuelve y el job falla en "Set up job"
      # sin llegar a escanear nada.
      - name: Escanear dependencias del backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: backend
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  scripts:
    name: Pruebas de los scripts de datos
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - run: npm ci
      - run: npm test
