version: 2

# Trivy (despliegue-ci.yml) avisa cuando una dependencia YA instalada tiene un CVE conocido.
# Dependabot es el complemento: propone el PR que la actualiza, para el backend y las
# propias GitHub Actions que usan los workflows.
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # ADR-059: el backend se queda en Spring Boot 3.5.x. Boot 4 (Spring Framework 7) es una migración
    # aparte, y springdoc 3.x solo funciona con Boot 4. Los parches y menores de ambos sí se proponen.
    # ADR-060: Testcontainers 2.x tampoco se propone — su BOM ya no fija la versión de
    # testcontainers-junit-jupiter ni testcontainers-mongodb tal como el pom.xml los declara.
    ignore:
      - dependency-name: "org.springframework.boot:spring-boot-starter-parent"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springdoc:springdoc-openapi-starter-webmvc-ui"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.testcontainers:testcontainers-bom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
