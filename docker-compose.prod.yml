networks:
  aguavigia:
    driver: bridge

services:
  mongo:
    image: mongo:7.0
    container_name: aguavigia-mongo
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-aguavigia}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Falta MONGO_ROOT_USERNAME en el .env de produccion}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Falta MONGO_ROOT_PASSWORD en el .env de produccion}
    # En producción NO exponemos puertos de BBDD al host
    volumes:
      - mongo-data:/data/db
    networks:
      - aguavigia
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping')\""]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aguavigia-redis
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Falta REDIS_PASSWORD en el .env de produccion}
    # noeviction y no una politica LRU: en este Redis viven las marcas de revocacion de sesion, los
    # cupos RF006 y el consenso, y una politica de expulsion las descartaria en silencio. Si llegara a
    # llenarse, es preferible que las escrituras fallen a la vista a que se pierdan controles de seguridad.
    command: ["sh", "-c", "exec redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-512mb} --maxmemory-policy noeviction --requirepass \"$REDIS_PASSWORD\""]
    # En producción NO exponemos puertos de BBDD al host
    volumes:
      - redis-data:/data
    networks:
      - aguavigia
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Sin container_name: con un nombre fijo Compose no puede crear mas de una replica.
    restart: always
    deploy:
      replicas: ${BACKEND_REPLICAS:-2}
      resources:
        limits:
          cpus: "2"
          memory: 2g
    env_file:
      - path: .env
        required: true # Prod requiere variables seguras
    environment:
      # No heredar SPRING_PROFILES_ACTIVE=docker del .env de desarrollo: produccion debe ejecutar
      # siempre sus validaciones estrictas de secretos y retencion.
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: ${SERVER_PORT:-8080}
      SPRING_DATA_MONGODB_URI: ${MONGODB_URI_PROD:?Falta MONGODB_URI_PROD en el .env de produccion}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?Falta REDIS_PASSWORD en el .env de produccion}
      # application-prod.yml los declara sin default a proposito (fallar ruidosamente, no
      # conectar en silencio a localhost) — sin esto, un .env de despliegue al que se le olvido
      # MAIL_HOST/MAIL_PORT solo falla hasta que Spring arranca dentro del contenedor.
      MAIL_HOST: ${MAIL_HOST:?Falta MAIL_HOST en el .env de produccion}
      MAIL_PORT: ${MAIL_PORT:?Falta MAIL_PORT en el .env de produccion}
      MAIL_USERNAME: ${MAIL_USERNAME:?Falta MAIL_USERNAME en el .env de produccion}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?Falta MAIL_PASSWORD en el .env de produccion}
      # El código lee aguavigia.app.url-publica (default http://localhost:8080); solo el compose de
      # desarrollo traducía APP_URL_PUBLICA, así que en producción los enlaces de los correos
      # salían a localhost. Sin definirla, el despliegue aborta en vez de mandar enlaces rotos.
      AGUAVIGIA_APP_URL_PUBLICA: ${APP_URL_PUBLICA:?Falta APP_URL_PUBLICA en el .env de produccion}
    # En producción el proxy reverso manejará el tráfico, NO exponemos 8080 directo
    volumes:
      - fotos-data:/app/data/fotos
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - aguavigia
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Único servicio que publica un puerto al host: el único salto antes del backend. Sustituye al
  # nginx del frontend retirado (ADR-048) y conserva lo que ese nginx hacía por seguridad:
  # X-Forwarded-For sobrescrito (el rate limit depende de eso), cabeceras de seguridad y proxy de
  # las fotos. La configuración vive en infra/nginx/.
  proxy:
    image: nginx:1.27-alpine
    container_name: aguavigia-proxy
    restart: always
    ports:
      - "80:80" # Expuesto directo en puerto web estándar
    # Solo lo que nginx necesita: escribir su caché y su pid en tmpfs, y las cuatro capacidades del
    # arranque (cambiar de usuario a los workers y abrir el puerto 80).
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./infra/nginx/nginx-main.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/nginx/security-headers.conf:/etc/nginx/security-headers.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aguavigia
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/api/sectores"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  mongo-data:
  redis-data:
  fotos-data:
