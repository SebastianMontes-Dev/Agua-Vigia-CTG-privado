add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;

# Defensa en profundidad contra robo del JWT del veedor (vive en sessionStorage) vía XSS: no hay
# `dangerouslySetInnerHTML`/`innerHTML` en el código hoy, pero esta capa no depende de que eso
# siga siendo cierto mañana. script-src sin 'unsafe-inline' porque Vite empaqueta todo el JS de
# producción en archivos externos, sin scripts inline. img-src cubre los dos proveedores de tiles
# de MapaCartagena.tsx (OpenStreetMap en claro, Esri en oscuro) más los `data:` URI de Leaflet.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.tile.openstreetmap.org https://server.arcgisonline.com; connect-src 'self'; font-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
