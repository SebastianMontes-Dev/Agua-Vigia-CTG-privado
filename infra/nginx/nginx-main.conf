# nginx.conf principal (docker-compose.prod.yml lo monta en /etc/nginx/nginx.conf).
#
# Existe solo para lo que la configuración por defecto de la imagen no permite tocar desde
# conf.d/: el número de conexiones por worker (el valor por defecto, 1024, limitaba cada worker a
# ~500 clientes SSE, porque cada uno consume dos conexiones) y el límite de descriptores.
# El servidor y las rutas viven en conf.d/default.conf (infra/nginx/nginx.conf).

worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;

    # Rutas temporales en tmpfs: el sistema de archivos del contenedor es de solo lectura.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/conf.d/*.conf;
}
