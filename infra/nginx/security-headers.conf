add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;

# Sin frontend, este origen solo sirve JSON, CSV, fotos y las páginas de cortesía del backend
# (ADR-030: /api/suscripciones/confirmar y /cancelar responden HTML a un navegador). Esas páginas
# llevan estilo en línea y ningún script, así que basta `style-src 'unsafe-inline'`. `default-src
# 'none'` deja fuera scripts, conexiones y cualquier recurso de terceros.
add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

# HSTS solo tiene sentido detrás de TLS (RNF026). Descomentar al activar HTTPS:
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
