# Proxy reverso de producción (docker-compose.prod.yml, servicio `proxy`).
#
# Sustituye el papel que cumplía el nginx del frontend retirado (ADR-048): es el único servicio
# que publica un puerto al host y el único salto antes del backend. Todo lo que no sea API o
# fotos responde 404 aquí mismo, sin llegar al backend. Además es la primera línea de defensa de
# escala (ADR-049): un micro-caché de las lecturas públicas, para que 50 000 personas mirando el
# mismo mapa no se traduzcan en 50 000 consultas a Mongo.

# El log usa $uri (sin query string) y no $request_uri: los enlaces de cuentas llevan el token en
# la query (`?token=`) y no debe quedar en el access_log.
log_format sin_query '$remote_addr - [$time_local] "$request_method $uri $server_protocol" '
                     '$status $body_bytes_sent "$http_user_agent" cache=$upstream_cache_status';

# Micro-caché de lecturas públicas. /var/cache/nginx es tmpfs (docker-compose.prod.yml).
# `inactive=30s`: una entrada que nadie pide se descarta pronto, y acota lo viejo que puede ser el primer dato servido tras un rato de calma (igual que stale-while-revalidate).
proxy_cache_path /var/cache/nginx/api levels=1:2 keys_zone=api_lectura:10m max_size=100m
                 inactive=30s use_temp_path=off;

# Freno por IP de lecturas y de conexiones SSE. Holgado a propósito: un edificio entero sin agua
# sale por una sola IP. El freno fino, por ruta, lo hace el backend (RateLimitingInterceptor).
limit_req_zone $binary_remote_addr zone=api_lectura_ip:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=sse_por_ip:10m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log sin_query;

    # `resolver` + variable en proxy_pass: nginx vuelve a resolver `backend` cada pocos segundos, así
    # que con varias réplicas (`docker compose up --scale backend=N`) reparte entre todas y no queda
    # fijado a la IP que tenía al arrancar. 127.0.0.11 es el DNS embebido de Docker.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend http://backend:8080;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types application/json application/problem+json application/geo+json text/csv text/plain;

    # El backend acepta fotos de hasta 10 MB (spring.servlet.multipart en application.yml). Con el
    # límite por defecto de nginx (1 MB) una foto de celular real recibía 413 antes de llegar.
    client_max_body_size 10m;

    # SSE (GET /api/sectores/stream): conexión larga y sin buffer. Con el proxy_read_timeout corto
    # y el buffering activo, nginx cortaba el stream a los pocos segundos y el cliente reintentaba
    # en bucle (ERR_INCOMPLETE_CHUNKED_ENCODING). El backend manda un latido cada 25 s, así que el
    # timeout de lectura solo salta si la conexión murió de verdad.
    location = /api/sectores/stream {
        include /etc/nginx/security-headers.conf;
        limit_conn sse_por_ip 20;
        limit_conn_status 429;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # $remote_addr y no $proxy_add_x_forwarded_for: este nginx es el primer y único salto
        # antes del backend (el puerto 8080 no se publica al host en producción). El segundo AÑADE
        # la IP real al final de cualquier X-Forwarded-For que ya traiga el cliente, así que un
        # atacante podía falsificar ese header y obtener una clave de rate limit nueva en cada
        # petición (RateLimitingInterceptor arma la clave con getRemoteAddr(), que
        # forward-headers-strategy: framework resuelve tomando el primer valor del header).
        # Sobrescribir con $remote_addr descarta lo que el cliente haya mandado.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 120s;
        add_header Cache-Control "no-store" always;
    }

    # Polígonos de los sectores: cambian solo al volver a sembrar y pesan ~0,7 MB. El backend ya manda
    # su propio Cache-Control (un día) para el navegador; aquí se guarda una hora.
    location = /api/sectores/geometria {
        include /etc/nginx/security-headers.conf;
        limit_req zone=api_lectura_ip burst=60 nodelay;
        limit_req_status 429;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Al backend siempre sin comprimir: lo que se guarda en la caché es una sola versión y
        # nginx la comprime al servirla. Si no, un cliente sin gzip podía recibir la variante gzip.
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_cache api_lectura;
        proxy_cache_key "$scheme$request_uri";
        proxy_cache_valid 200 1h;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_no_cache $http_authorization;
        proxy_cache_bypass $http_authorization;
        # Aquí sí vale el Cache-Control del origen (un día para el navegador); solo se descarta `Vary`
        # por la misma razón que en el bloque de lecturas públicas.
        proxy_ignore_headers Vary;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Lecturas públicas: mismo resultado para todos, así que se sirven de una caché de segundos.
    #  - proxy_cache_lock: si expira la entrada y llegan mil peticiones a la vez, pasa UNA al backend.
    #  - proxy_cache_use_stale: si el backend cae o tarda, se sirve lo último bueno en vez de un 5xx.
    #  - proxy_cache_background_update: el cliente nunca espera la renovación.
    # `add_header` sin `always`: solo en respuestas 2xx/3xx, así un error no queda marcado como cacheable.
    # /api/sectores/{id} entra aquí también: el regex no captura `/stream` ni `/geometria` porque sus
    # `location =` exactos ganan antes.
    location ~ ^/api/(sectores|estadisticas|cumplimiento|bitacora)(/|$) {
        include /etc/nginx/security-headers.conf;
        limit_req zone=api_lectura_ip burst=60 nodelay;
        limit_req_status 429;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Ver el comentario del bloque del SSE: sobrescribir, nunca acumular.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_cache api_lectura;
        proxy_cache_key "$scheme$request_uri";
        proxy_cache_methods GET HEAD;
        proxy_cache_valid 200 5s;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        # Una petición con credenciales nunca se cachea ni se sirve de la caché.
        proxy_no_cache $http_authorization;
        proxy_cache_bypass $http_authorization;
        # El backend responde `Cache-Control: no-cache, no-store` (valor por defecto de Spring Security)
        # y nginx lo respeta: sin esto NUNCA cachea y las 50 000 personas llegan al backend. Se ignoran
        # las cabeceras de caché del origen y se ocultan (si no, salen dos `Cache-Control` que se
        # contradicen); la validez la fija solo `proxy_cache_valid 200 5s`, así un 404 nunca se cachea.
        # `Vary` también: el origen lo emite por Origin y Accept-Encoding, y ni un cliente sin Origin
        # (todo pasa por este proxy) ni la codificación (se pide sin comprimir) cambian la respuesta;
        # sin ignorarlo, la caché se fragmenta en una variante por cada `Accept-Encoding` de cliente.
        proxy_ignore_headers Set-Cookie Cache-Control Expires Vary;
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header Expires;
        add_header Cache-Control "public, max-age=5, stale-while-revalidate=30";
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Todo lo demás de la API (escrituras, panel, cuentas, suscripciones, reportes, IoT): sin caché.
    location /api/ {
        include /etc/nginx/security-headers.conf;
        limit_req zone=api_lectura_ip burst=60 nodelay;
        limit_req_status 429;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Ver el comentario del bloque del SSE: sobrescribir, nunca acumular.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    # Evidencia fotográfica de los reportes (AlmacenamientoWebConfig sirve /fotos/**). El nginx del
    # frontend no lo proxeaba: la API devolvía `fotoUrl: /fotos/<uuid>.jpg` y esa ruta caía en el
    # fallback del SPA. El nombre es un UUID y el archivo no cambia, así que se puede cachear.
    location /fotos/ {
        include /etc/nginx/security-headers.conf;
        limit_req zone=api_lectura_ip burst=60 nodelay;
        limit_req_status 429;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        proxy_cache api_lectura;
        proxy_cache_key "$scheme$request_uri";
        proxy_cache_valid 200 1h;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header Cache-Control "public, max-age=86400";
    }

    # Portadas de los boletines de Acuacar: EventoBitacoraRespuesta.imagenUrl trae la URL absoluta de
    # acuacar.com, y ese sitio bloquea el hotlinking (la misma imagen responde 200 sin `Referer` y 403
    # con uno de otro dominio, verificado el 31/08/2026). Un cliente web las pide aquí sustituyendo
    # `https://www.acuacar.com/wp-content/uploads/` por `/acuacar-media/`, y se piden desde el
    # servidor y se sirven como propias. El User-Agent identifica al proyecto, nunca lo disfraza
    # (CLAUDE.md, ética de datos, punto 3).
    #
    # Se limita a /wp-content/uploads/ a propósito, que es donde WordPress guarda los medios:
    # abrir todo el dominio convertiría esto en un proxy abierto hacia acuacar.com.
    #
    # El destino va en una variable y con `resolver` (definido arriba) para que nginx resuelva el
    # DNS al recibir la petición, no al arrancar: con `proxy_pass` a un nombre fijo, un fallo de
    # DNS de acuacar.com impedía que arrancara todo el proxy (y con él la API).
    location ^~ /acuacar-media/ {
        include /etc/nginx/security-headers.conf;
        set $acuacar_origen https://www.acuacar.com;
        rewrite ^/acuacar-media/(.*)$ /wp-content/uploads/$1 break;
        proxy_pass $acuacar_origen;
        proxy_ssl_server_name on;
        proxy_set_header Host www.acuacar.com;
        proxy_set_header User-Agent "AguaVigiaCTG-Bot/1.0 (+alertas@aguavigia.com)";
        # Sin Referer: es justo la cabecera que dispara el bloqueo del lado de Acuacar.
        proxy_set_header Referer "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 15s;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Todo lo demás (incluidos /actuator, /swagger-ui.html y /v3/api-docs) no sale al exterior:
    # sin el frontend ya no hay un fallback a index.html que lo absorba.
    location / {
        include /etc/nginx/security-headers.conf;
        default_type application/problem+json;
        return 404 '{"type":"about:blank","title":"Recurso no encontrado","status":404}';
    }
}
